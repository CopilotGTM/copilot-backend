[pytest]
addopts = -q -ra --log-cli-level=INFO
pythonpath = src
testpaths = tests
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)8s | %(name)s | %(message)s
log_date_format = %H:%M:%S
filterwarnings =
    ignore:.*pydantic.*deprecated.*:DeprecationWarning
    ignore:.*Valid config keys have changed in V2.*:UserWarning
    ignore:.*builtin type Swig.*:DeprecationWarning
    ignore:.*retry_on_timeout.*:DeprecationWarning
    # Additional Pydantic v2 migration noise suppression (simplified patterns)
    ignore:.*class-based `config` is deprecated.*:DeprecationWarning
    ignore:.*update_forward_refs.*deprecated.*:DeprecationWarning
    ignore:.*extra keyword arguments on `Field` is deprecated.*:DeprecationWarning
    ignore:.*GenericModel.*moved to `pydantic.BaseModel`.*:UserWarning
