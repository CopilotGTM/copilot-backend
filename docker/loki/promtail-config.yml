# Promtail Configuration for Local Development
# Collects logs from Docker containers and sends to Loki
#
# IMPORTANT: Set LOG_FORMAT=json in your .env for structured logging

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Add environment label
      - target_label: 'environment'
        replacement: 'local'
    pipeline_stages:
      # Parse JSON logs to extract level for labeling
      # Full JSON is preserved in log line for querying request_id, celery_task_id, etc.
      - json:
          expressions:
            level: level
            logger: logger
      # Add level as label for filtering (low cardinality)
      - labels:
          level:
          logger:
      # Keep full JSON log line intact (don't use output stage)
      # This preserves request_id, celery_task_id, etc. for querying with:
      #   {container="copilot-api"} | json | request_id="abc123"
