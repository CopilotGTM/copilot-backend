# Loki Configuration for Local Development
# Documentation: https://grafana.com/docs/loki/latest/configuration/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  # Allow larger log lines (default is 256KB)
  max_line_size: 512KB
  # Retention period - 7 days for local dev
  retention_period: 168h
  # Allow more streams per user
  max_streams_per_user: 10000
  # Ingestion rate limits (relaxed for local dev)
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

# Compactor for log retention
compactor:
  working_directory: /loki/retention
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Analytics disabled for privacy
analytics:
  reporting_enabled: false
