  config:
    concurrency: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: "25m"
      memory: "1Gi"

dealCronJobs:
  jobs:
    - name: meeting-bot-fallback
      schedule: "0 20 * * *"
    - name: sales-dashboard-snapshot
      schedule: "15 1 * * *"

deal-beat:
  enabled: false
  # Actual usage: 0m CPU, 141Mi memory
  resources:
