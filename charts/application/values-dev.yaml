# =============================================================================
# DEV ENVIRONMENT OVERRIDES
# =============================================================================
# Reduced resource requests based on actual kubectl top pod metrics.
# This enables AKS cluster autoscaler to scale down to 1 node when idle.
#
# Usage: helm upgrade --install ... -f values.yaml -f values-dev.yaml
# =============================================================================

api:
  replicaCount: 1
  gateway:
    enabled: true
    mode: validation
    validation:
      enabled: true
  networkPolicy:
    envoyGateway:
      enabled: true
  secrets:
    APP_URL: "https://devapp.copilotgtm.com"
    ADMIN_APP_URL: "https://devadmin.copilotgtm.com"
    ALLOW_ORIGIN_URL_AUTH: "https://devapp.copilotgtm.com,https://devadmin.copilotgtm.com"
    FROM_EMAIL: "noreply@team.copilotgtm.com"
    SUPER_ADMIN_EMAIL: "tech@copilotgtm.com"
    SENTRY_DSN: "https://d47183944100e4f69572365fd1634d16@o4511017432186880.ingest.us.sentry.io/4511017435070464"
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    VOICE_REALTIME_API_ENABLED: "true"
    # Non-secret Recall defaults; credentials still come from the pipeline/KV path.
    RECALL_REGION: "us-west-2"
    RECALL_TIMEOUT_SECONDS: "30"
    RECALL_BOT_NAME: "CopilotGTM Notetaker"
    OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-us-west-0.grafana.net/otlp"
    REDIS_SSL_CERT_REQS: "CERT_REQUIRED"
    GOOGLE_REDIRECT_URI: "https://devapi.copilotgtm.com/users/integrations/copilot-oauth/callback"
    GOOGLE_CHAT_AUTH_AUDIENCE: "https://devapi.copilotgtm.com/users/bots/google-chat/events"
    GOOGLE_WEBHOOK_BASE_URL: "https://devapi.copilotgtm.com"
    MICROSOFT_REDIRECT_URI: "https://devapi.copilotgtm.com/users/integrations/copilot-oauth/callback"
    MICROSOFT_GRAPH_WEBHOOK_BASE_URL: "https://devapi.copilotgtm.com"
    SLACK_REDIRECT_URI: "https://devapi.copilotgtm.com/users/integrations/copilot-oauth/callback"
    SLACK_BOT_REDIRECT_URI: "https://devapi.copilotgtm.com/users/bots/slack/oauth/callback"
    HUBSPOT_REDIRECT_URI: "https://devapi.copilotgtm.com/users/integrations/copilot-oauth/callback"
    HUBSPOT_WEBHOOK_PUBLIC_URL: "https://devapi.copilotgtm.com/users/integrations/hubspot/webhook"
    SALESFORCE_REDIRECT_URI: "https://devapi.copilotgtm.com/users/integrations/copilot-oauth/callback"
    SALESFORCE_EXTERNAL_CLIENT_APP_INSTALL_URL: "https://login.salesforce.com/packaging/installPackage.apexp?p0=04tdM000000U44bQAC"
    WHATSAPP_BOT_PHONE_NUMBER: "+15556300848"
    DATABASE_PORT: "5432"
  autoscaling:
    minReplicas: 1
  # Actual usage: 4-8m CPU, ~500Mi memory; keep request above baseline so HPA does not scale dev API on idle memory.
  resources:
    limits:
      cpu: 500m
      memory: 1536Mi
    requests:
      cpu: 50m
      memory: 1Gi

knowledge-upload-worker:
  # Actual usage: 3m CPU, 985Mi memory
  config:
    concurrency: 1
  autoscaling:
    maxReplicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "1Gi"

knowledge-extract-worker:
  config:
    concurrency: 1
  autoscaling:
    maxReplicas: 1

knowledge-beat:
  enabled: false
  # Actual usage: 1m CPU, 225Mi memory
  resources:
    requests:
      cpu: "10m"
      memory: "256Mi"
    limits:
      cpu: "150m"
      memory: "512Mi"

chat-worker:
  # Actual usage: 3m CPU, 763Mi memory
  config:
    concurrency: 1
    maxTasksPerChild: 25
    maxMemoryPerChildKb: 700000
  autoscaling:
    maxReplicas: 2
  resources:
    requests:
      cpu: "50m"
      memory: "1Gi"

chat-beat:
  # Actual usage: 253Mi memory (loads full chat worker with agent tools + dateparser)
  resources:
    requests:
      cpu: "10m"
      memory: "256Mi"
    limits:
      cpu: "150m"
      memory: "512Mi"

integrations-worker:
  # Actual usage: 3m CPU, 1081Mi memory
  config:
    concurrency: 1
  autoscaling:
    minReplicas: 0
    maxReplicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "1536Mi"

integrationsCronJobs:
  jobs:
    - name: refresh-tokens
      schedule: "0 */4 * * *"
    - name: renew-microsoft-graph-subscriptions
      schedule: "0 */12 * * *"
    - name: renew-google-subscriptions
      schedule: "0 2 * * *"

knowledgeCronJobs:
  jobs:
    - name: cleanup-stale-knowledge-jobs
      schedule: "0,30 * * * *"
    - name: cleanup-stale-db-connections-every-10-min
      resourceName: cleanup-stale-db-connections
      schedule: "*/10 * * * *"

deal-worker:
  # Actual usage: 3m CPU, 744Mi memory
  config:
    concurrency: 1
  autoscaling:
    minReplicas: 0
    maxReplicas: 1
  resources:
    requests:
      cpu: "50m"
      memory: "1Gi"

dealCronJobs:
  jobs:
    - name: stale-deal-job-cleanup
      schedule: "45 * * * *"
    - name: meeting-bot-fallback
      schedule: "0 20 * * *"

deal-beat:
  enabled: false
  # Actual usage: 0m CPU, 141Mi memory
  resources:
    requests:
      cpu: "10m"
      memory: "192Mi"

integrations-beat:
  enabled: false
  # Actual usage: 0m CPU, 104Mi memory
  resources:
    requests:
      cpu: "10m"

organization-worker:
  config:
    concurrency: 1
  autoscaling:
    maxReplicas: 1
