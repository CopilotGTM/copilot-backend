# =============================================================================
# DEV ENVIRONMENT OVERRIDES
# =============================================================================
# Reduced resource requests based on actual kubectl top pod metrics.
# This enables AKS cluster autoscaler to scale down to 1 node when idle.
#
# Usage: helm upgrade --install ... -f values.yaml -f values-dev.yaml
# =============================================================================

api:
  replicaCount: 1
  secrets:
    APP_URL: "https://devapp.copilotgtm.com"
    ADMIN_APP_URL: "https://devadmin.copilotgtm.com"
    FROM_EMAIL: "noreply@team.copilotgtm.com"
    SUPER_ADMIN_EMAIL: "tech@copilotgtm.com"
    OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-us-west-0.grafana.net/otlp"
    REDIS_SSL_CERT_REQS: "CERT_REQUIRED"
    GOOGLE_REDIRECT_URI: "https://devapi.copilotgtm.com/users/integrations/copilot-oauth/callback"
    MICROSOFT_REDIRECT_URI: "https://devapi.copilotgtm.com/users/integrations/copilot-oauth/callback"
  autoscaling:
    minReplicas: 1
  # Actual usage: 6m CPU, 427Mi memory
  resources:
    limits:
      cpu: 500m
      memory: 1536Mi
    requests:
      cpu: 50m
      memory: 512Mi

knowledge-upload-worker:
  # Actual usage: 3m CPU, 985Mi memory
  resources:
    requests:
      cpu: "50m"
      memory: "1Gi"

knowledge-beat:
  # Actual usage: 1m CPU, 225Mi memory
  resources:
    requests:
      cpu: "10m"
      memory: "256Mi"
    limits:
      cpu: "150m"
      memory: "512Mi"

chat-worker:
  # Actual usage: 3m CPU, 763Mi memory
  resources:
    requests:
      cpu: "50m"
      memory: "1Gi"

chat-beat:
  # Actual usage: 253Mi memory (loads full chat worker with agent tools + dateparser)
  resources:
    requests:
      cpu: "10m"
      memory: "256Mi"
    limits:
      cpu: "150m"
      memory: "512Mi"

integrations-worker:
  # Actual usage: 3m CPU, 1081Mi memory
  resources:
    requests:
      cpu: "50m"
      memory: "1536Mi"

deal-worker:
  # Actual usage: 3m CPU, 744Mi memory
  resources:
    requests:
      cpu: "50m"
      memory: "1Gi"

deal-beat:
  # Actual usage: 0m CPU, 141Mi memory
  resources:
    requests:
      cpu: "10m"
      memory: "192Mi"

integrations-beat:
  enabled: false
  # Actual usage: 0m CPU, 104Mi memory
  resources:
    requests:
      cpu: "10m"
