# Global values can be defined here
global:
  redis:
    host: "redis-master.default.svc.cluster.local"
    port: 6379                                       # Overridden in pipeline with --set global.redis.port
    enableTLS: true                                  # Set true for Azure Redis (port 6380)
    usePassword: true                                # Set true to create TriggerAuthentication for password
  # Must match the api chart secret name (<fullname>-secret) so workers & KEDA reference an existing secret
  secretName: "copilot-backend-secret"

# Configuration for the main API
api:
  enabled: true
  fullnameOverride: copilot-backend
  # Add any custom annotations for this specific service here
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "80"

  # Add any custom labels for this specific service here
  labels:
    tier: "backend"
    owner: "api-team"

  replicaCount: 1
  environment: development

  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/websocket-services: copilot-backend
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt"
    hosts:
      - host: "devapi.copilotgtm.com"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - "devapi.copilotgtm.com"
        secretName: "devapi-tls"

  # HPA for the API (CPU/Memory based)
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 1500m
      memory: 6Gi
    requests:
      cpu: 1000m
      memory: 3Gi

  serviceAccount:
    create: true
    name: "copilot-backend"

  # Workload Identity settings (populated by Terraform output/pipeline)
  workloadIdentity:
    clientId: ""  # override with the federated workload identity application client id
  tenantId: ""  # optional; set to ensure tokens are requested from correct tenant

  # Define any Helm hook jobs for this specific service
  jobs:
    startup:
      enabled: true
      hook: "post-install,post-upgrade"
      hookWeight: "1"
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -euo pipefail
          echo "[startup-job] Starting migrations & seeding..."
          sh ./scripts/startup.sh
          echo "[startup-job] Completed successfully."

  # Inline secrets (key: value) encoded automatically; override via --set-file for real secrets
  secrets: {}

# Knowledge Workers Configuration
knowledge-extract-worker:
  enabled: true
  replicaCount: 0  # Start with 0 replicas - scale from zero
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
  pullPolicy: IfNotPresent
  config:
    queueName: "knowledge_extract"
    concurrency: 1
  
  # GPU Node Pool Configuration
  # Targets dedicated GPU node pool (kgpu) with NVIDIA Tesla T4 GPU
  # Node pool specs: Standard_NC4as_T4_v3 (4 vCPU, 28GB RAM, 1x T4 GPU)
  gpu:
    enabled: true
    # Node selector to target GPU node pool
    nodeSelector:
      workload: knowledge-gpu
    # Tolerations to allow scheduling on tainted GPU nodes
    tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule
  
  # GPU Resource Requests and Limits
  # Request most of the node's capacity to maximize utilization
  resources:
    requests:
      nvidia.com/gpu: 1      # Request 1 Tesla T4 GPU
      cpu: "2000m"           # Reserve 2 vCPU (of 4 available)
      memory: "16Gi"         # Reserve 16GB RAM (of 28GB available)
    limits:
      nvidia.com/gpu: 1      # Request 1 Tesla T4 GPU
      cpu: "3500m"           # Allow burst to 3.5 vCPU
      memory: "24Gi"         # Allow burst to 24GB RAM
  
  # KEDA Autoscaling Configuration
  # Note: Cold start from scale-to-zero takes 3-5 minutes for GPU node provisioning
  autoscaling:
    enabled: true
    minReplicas: 0           # Scale to zero when idle (cost optimization)
    maxReplicas: 1           # Single GPU node limit (can be increased if needed)
    queueLength: 1           # Scale up when 1+ tasks in queue
    scaleDownDelay: 600      # Wait 10 minutes before scaling down (node deprovisioning)
    scaleUpDelay: 10         # Check queue every 10 seconds
  
  # Pod Disruption Budget - Allow zero pods during disruptions
  # Critical for scale-to-zero behavior and cluster maintenance
  pdb:
    enabled: true
    minAvailable: 0          # Allow zero pods (supports scale-to-zero)

knowledge-upload-worker:
  enabled: true
  replicaCount: 0
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
  pullPolicy: IfNotPresent
  config:
    queueName: "knowledge_upload"
    concurrency: 2
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "750m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    queueLength: 50
    scaleDownDelay: 180
    scaleUpDelay: 4

# Organization Worker
organization-worker:
  enabled: true
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "organization"
    concurrency: 5
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 1 
    maxReplicas: 5
    queueLength: 1
    scaleDownDelay: 300
    scaleUpDelay: 5

# Chat Worker (All Chat Queues: attachments, chat_processing, chat_messages)
chat-worker:
  enabled: true
  replicaCount: 0
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "attachments"
    additionalQueues: ["chat_processing", "chat_messages"]
    concurrency: 3
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "750m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    queueLength: 2
    scaleDownDelay: 240
    scaleUpDelay: 5
