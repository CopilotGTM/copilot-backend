# Global values can be defined here
global:
  redis:
    host: "redis-master.default.svc.cluster.local"
    port: 6379                                       # Overridden in pipeline with --set global.redis.port
    enableTLS: true                                  # Set true for Azure Redis (port 6380)
    usePassword: true                                # Set true to create TriggerAuthentication for password
  # Must match the api chart secret name (<fullname>-secret) so workers & KEDA reference an existing secret
  secretName: "copilot-backend-secret"

# Configuration for the main API
api:
  enabled: true
  fullnameOverride: copilot-backend
  # Add any custom annotations for this specific service here
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"

  # Add any custom labels for this specific service here
  labels:
    tier: "backend"
    owner: "api-team"

  replicaCount: 1
  environment: development

  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/websocket-services: copilot-backend
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt"
    hosts:
      - host: "devapi.copilotgtm.com"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - "devapi.copilotgtm.com"
        secretName: "devapi-tls"

  # HPA for the API (CPU/Memory based)
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 1500m
      memory: 6Gi
    requests:
      cpu: 1000m
      memory: 3Gi

  serviceAccount:
    create: true
    name: "copilot-backend"

  # Workload Identity settings (populated by Terraform output/pipeline)
  workloadIdentity:
    clientId: ""  # override with the federated workload identity application client id
  tenantId: ""  # optional; set to ensure tokens are requested from correct tenant

  # Define any Helm hook jobs for this specific service
  jobs:
    startup:
      enabled: true
      hook: "post-install,post-upgrade"
      hookWeight: "1"
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          echo "[startup-job] Starting migrations & seeding..."
          bash ./scripts/startup.sh
          echo "[startup-job] Completed successfully."

  # Inline secrets (key: value) encoded automatically; override via --set-file for real secrets
  secrets: {}

# Knowledge Workers Configuration
knowledge-extract-worker:
  enabled: true
  replicaCount: 0  # Start with 0 replicas - scale from zero
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
  pullPolicy: IfNotPresent
  config:
    queueName: "knowledge_extract"
    concurrency: 3

  # High-Compute CPU Node Pool Configuration
  # Targets dedicated CPU node pool (kgpu) with high-compute resources
  # Node pool specs: Standard_D8s_v3 (8 vCPU, 32GB RAM)
  # Note: Despite the name "kgpu", this is now a CPU-only node pool
  gpu:
    enabled: true
    # Node selector to target dedicated node pool
    nodeSelector:
      workload: knowledge-gpu
    # Tolerations to allow scheduling on tainted nodes
    tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule

  # High-Compute CPU Resource Requests and Limits
  # Request most of the node's capacity to maximize utilization
  resources:
    requests:
      cpu: "7"              # Reserve 7 vCPU (of 8 available)
      memory: "28Gi"        # Reserve 28GB RAM (of 32GB available)
    limits:
      cpu: "8"              # Allow burst to full 8 vCPU
      memory: "30Gi"        # Allow burst to full 30GB RAM

  # KEDA Autoscaling Configuration
  # Note: Cold start from scale-to-zero takes 2-3 minutes for node provisioning
  autoscaling:
    enabled: true
    minReplicas: 0           # Scale to zero when idle (cost optimization)
    maxReplicas: 1           # Single node limit (can be increased if needed)
    queueLength: 1           # Scale up when 1+ tasks in queue
    scaleDownDelay: 600      # Wait 10 minutes before scaling down (node deprovisioning)
    scaleUpDelay: 10         # Check queue every 10 seconds

  # Pod Disruption Budget - Allow zero pods during disruptions
  # Critical for scale-to-zero behavior and cluster maintenance
  pdb:
    enabled: true
    minAvailable: 0          # Allow zero pods (supports scale-to-zero)

knowledge-upload-worker:
  enabled: true
  replicaCount: 0
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
  pullPolicy: IfNotPresent
  config:
    queueName: "knowledge_upload"
    concurrency: 4
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1500m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    queueLength: 50
    scaleDownDelay: 180
    scaleUpDelay: 4

# Organization Worker
organization-worker:
  enabled: true
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "organization"
    concurrency: 5
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    queueLength: 1
    scaleDownDelay: 300
    scaleUpDelay: 5

# Chat Worker (All Chat Queues: attachments, chat_processing, chat_messages)
chat-worker:
  enabled: true
  replicaCount: 0
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "attachments"
    additionalQueues: ["chat_processing", "chat_messages"]
    concurrency: 5
  resources:
    requests:
      cpu: "500m"
      memory: "1.5Gi"
    limits:
      cpu: "1500m"
      memory: "2.5Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    queueLength: 2
    scaleDownDelay: 240
    scaleUpDelay: 5

# Integrations Worker (handles CRM/third-party sync pipelines)
integrations-worker:
  enabled: true
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "integrations"
    additionalQueues: ["integrations_priority"]
    concurrency: 8  # Reduced from 20 to prevent OOM
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    queueLength: 5
    scaleDownDelay: 240
    scaleUpDelay: 10

# Deal Worker (handles deal-meeting matching, email matching, stakeholders)
deal-worker:
  enabled: true
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "deal"
    additionalQueues: ["deal_jobs"]
    concurrency: 4
    gracefulTimeout: 540  # 9 minutes for long-running deal processing
  resources:
    requests:
      cpu: "500m"
      memory: "768Mi"
    limits:
      cpu: "1000m"
      memory: "1.5Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    queueLength: 3
    scaleDownDelay: 300
    scaleUpDelay: 10

# Deal Beat Scheduler (Celery Beat for scheduled deal tasks)
# Runs periodic tasks defined in DealWorkerConfig.beat_schedule:
# - deal.trigger_deal_meeting_processing_all_orgs: Every 2 hours
# - deal.trigger_deal_email_processing_all_orgs: Every hour at :30
# - stakeholder.trigger_analysis_all_orgs: Daily at 2 AM
deal-beat:
  enabled: true
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "deal"
    # Beat mode - runs scheduler instead of worker
    beatMode: true
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  # Beat scheduler doesn't need autoscaling - single instance only
  autoscaling:
    enabled: false
  # Beat scheduler doesn't need PDB
  pdb:
    enabled: false
