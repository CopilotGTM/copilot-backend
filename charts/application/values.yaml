# Global values can be defined here
global:
  redis:
    host: "redis-master.default.svc.cluster.local"
    port: 6379                                       # Overridden in pipeline with --set global.redis.port
    enableTLS: true                                  # Set true for Azure Redis (port 6380)
    usePassword: true                                # Set true to create TriggerAuthentication for password
  celery:
    enableEvents: true
  # Must match the api chart secret name (<fullname>-secret) so workers & KEDA reference an existing secret
  secretName: "copilot-backend-secret"

# Configuration for the main API
api:
  enabled: true
  fullnameOverride: copilot-backend
  # Add any custom annotations for this specific service here
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"

  # Add any custom labels for this specific service here
  labels:
    tier: "backend"
    owner: "api-team"

  replicaCount: 2  # Minimum 2 for high availability during restarts
  environment: development

  # Rolling update strategy - allows temporary reduction during deploys to avoid resource deadlock
  strategy:
    type: RollingUpdate
    maxSurge: 1         # Allow 1 extra pod during rollout
    maxUnavailable: 1   # Allow 1 pod to be unavailable during rollout

  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: "azure-application-gateway"
    annotations:
      # Azure Application Gateway (WAF) annotations
      appgw.ingress.kubernetes.io/backend-protocol: "http"
      appgw.ingress.kubernetes.io/request-timeout: "3600"
      appgw.ingress.kubernetes.io/connection-draining: "true"
      appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
      appgw.ingress.kubernetes.io/cookie-based-affinity: "false"
      # WebSocket support
      appgw.ingress.kubernetes.io/backend-hostname: "copilot-backend"
      # SSL/TLS - cert-manager creates the secret, AGIC uses it
      cert-manager.io/cluster-issuer: "letsencrypt"
    hosts:
      - host: "devapi.copilotgtm.com"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - "devapi.copilotgtm.com"
        secretName: "devapi-tls"

  gateway:
    enabled: false
    mode: disabled
    disableLegacyIngress: false
    gatewayName: copilot-backend
    gatewayClassName: envoy-gateway-dev
    host: "devapi.copilotgtm.com"
    tlsSecretName: "devapi-tls"
    routeName: copilot-backend
    timeouts:
      request: "3600s"
      backendRequest: ""
    validation:
      enabled: false
      gatewayName: copilot-backend-envoy-validation
      host: "devapi-envoy.copilotgtm.com"
      tlsSecretName: "devapi-envoy-tls"
      routeName: copilot-backend-envoy-validation

  # HPA for the API (CPU/Memory based)
  # Enabled for high availability - ensures at least 2 pods are always running
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 1500m
      memory: 6Gi
    requests:
      cpu: 1000m
      memory: 3Gi

  serviceAccount:
    create: true
    name: "copilot-backend"

  # Workload Identity settings (populated by Terraform output/pipeline)
  workloadIdentity:
    clientId: ""  # override with the federated workload identity application client id
  tenantId: ""  # optional; set to ensure tokens are requested from correct tenant

  # Define any Helm hook jobs for this specific service
  jobs:
    startup:
      enabled: true
      hook: "post-install,post-upgrade"
      hookWeight: "1"
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          echo "[startup-job] Starting migrations & seeding..."
          bash ./scripts/startup.sh
          echo "[startup-job] Completed successfully."

  # Inline secrets (key: value) encoded automatically; override via --set-file for real secrets
  secrets:
    # Non-local deployments must set explicit CORS origins; wildcard origins are rejected in app code.
    ALLOW_ORIGIN_URL_AUTH: ""
    # Voice realtime APIs are fail-closed by default and enabled per environment override.
    VOICE_REALTIME_API_ENABLED: "false"
    # Recall.ai defaults shared by API, workers, and cronjobs via the common app secret.
    RECALL_REGION: "us-west-2"
    RECALL_TIMEOUT_SECONDS: "30"
    RECALL_BOT_NAME: "CopilotGTM Notetaker"
    # Set these in your environment-specific pipeline/secret source.
    RECALL_API_KEY: ""
    RECALL_WEBHOOK_SECRET: ""
    # Google webhook setup. The Pub/Sub push endpoint must include
    # ?kind=gmail&token=<GOOGLE_GMAIL_PUBSUB_PUSH_TOKEN>.
    GOOGLE_WEBHOOK_BASE_URL: ""
    GOOGLE_GMAIL_PUBSUB_TOPIC: ""
    GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION: ""
    GOOGLE_GMAIL_PUBSUB_PUSH_TOKEN: ""

# Knowledge Workers Configuration
knowledge-extract-worker:
  enabled: true
  replicaCount: 0  # Start with 0 replicas - scale from zero
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
  pullPolicy: IfNotPresent
  config:
    queueName: "knowledge_extract"
    concurrency: 3
  # Use shared ServiceAccount (created at parent chart level)
  serviceAccount:
    create: false
    name: "copilot-workers"

  # High-Compute CPU Node Pool Configuration
  # Targets dedicated CPU node pool (kgpu) with high-compute resources
  # Node pool specs: Standard_D8s_v3 (8 vCPU, 32GB RAM)
  # Note: Despite the name "kgpu", this is now a CPU-only node pool
  gpu:
    enabled: true
    # Node selector to target dedicated node pool
    nodeSelector:
      workload: knowledge-gpu
    # Tolerations to allow scheduling on tainted nodes
    tolerations:
    - key: dedicated
      operator: Equal
      value: gpu
      effect: NoSchedule

  # High-Compute CPU Resource Requests and Limits
  # Request most of the node's capacity to maximize utilization
  resources:
    requests:
      cpu: "7"              # Reserve 7 vCPU (of 8 available)
      memory: "28Gi"        # Reserve 28GB RAM (of 32GB available)
    limits:
      cpu: "8"              # Allow burst to full 8 vCPU
      memory: "30Gi"        # Allow burst to full 30GB RAM

  # KEDA Autoscaling Configuration
  # Note: Cold start from scale-to-zero takes 2-3 minutes for node provisioning
  autoscaling:
    enabled: true
    minReplicas: 0           # Scale to zero when idle (cost optimization)
    maxReplicas: 1           # Single node limit (can be increased if needed)
    queueLength: 1           # Scale up when 1+ tasks in queue
    scaleDownDelay: 600      # Wait 10 minutes before scaling down (node deprovisioning)
    scaleUpDelay: 10         # Check queue every 10 seconds

  # Pod Disruption Budget - Allow zero pods during disruptions
  # Critical for scale-to-zero behavior and cluster maintenance
  pdb:
    enabled: true
    minAvailable: 0          # Allow zero pods (supports scale-to-zero)

knowledge-upload-worker:
  enabled: true
  replicaCount: 0
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
  pullPolicy: IfNotPresent
  config:
    queueName: "knowledge_upload"
    concurrency: 5
  # Use shared ServiceAccount (created by knowledge-extract-worker)
  serviceAccount:
    create: false
    name: "copilot-workers"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1500m"
      memory: "1.5Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    queueLength: 50
    scaleDownDelay: 180
    scaleUpDelay: 4

# Legacy Celery Beat config for knowledge worker.
# Fixed knowledge schedules are owned by Kubernetes CronJobs below.
knowledge-beat:
  enabled: false
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "knowledge_upload"
    # Beat mode - runs scheduler instead of worker
    beatMode: true
  # Use shared ServiceAccount (created by knowledge-extract-worker)
  serviceAccount:
    create: false
    name: "copilot-workers"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"
  # Beat scheduler doesn't need autoscaling - single instance only
  autoscaling:
    enabled: false
  # Beat scheduler doesn't need PDB
  pdb:
    enabled: false

# Organization Worker
organization-worker:
  enabled: true
  replicaCount: 0
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "organization"
    concurrency: 5
  # Use shared ServiceAccount (created by knowledge-extract-worker)
  serviceAccount:
    create: false
    name: "copilot-workers"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 0
    maxReplicas: 5
    queueLength: 2
    scaleDownDelay: 300
    scaleUpDelay: 5

# Chat Worker (All Chat Queues: attachments, chat_processing, chat_messages)
chat-worker:
  enabled: true
  replicaCount: 0
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "attachments"
    additionalQueues: ["chat_processing", "chat_messages", "voice_realtime"]
    concurrency: 5
  # Use shared ServiceAccount (created by knowledge-extract-worker)
  serviceAccount:
    create: false
    name: "copilot-workers"
  resources:
    requests:
      cpu: "500m"
      memory: "1.5Gi"
    limits:
      cpu: "1500m"
      memory: "2.5Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 8
    queueLength: 2
    scaleDownDelay: 240
    scaleUpDelay: 5

# Chat Beat Scheduler (Celery Beat for reminder polling)
# Runs periodic tasks defined in ChatWorkerConfig.beat_schedule:
# - chat.poll_due_reminders: Every 5 seconds (pops due reminders from Redis ZSET)
# - chat.recovery_sweep_reminders: Every 5 minutes (re-syncs ZSET from DB)
chat-beat:
  enabled: true
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "chat_processing"
    # Beat mode - runs scheduler instead of worker
    beatMode: true
  # Use shared ServiceAccount (created at parent chart level)
  serviceAccount:
    create: false
    name: "copilot-workers"
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "150m"
      memory: "512Mi"
  # Beat scheduler doesn't need autoscaling - single instance only
  autoscaling:
    enabled: false
  # Beat scheduler doesn't need PDB
  pdb:
    enabled: false

# Integrations Worker (handles CRM/third-party sync pipelines)
integrations-worker:
  enabled: true
  replicaCount: 1
  image:
    repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  config:
    queueName: "integrations"
    additionalQueues: ["integrations_priority", "integrations_streaming"]
    concurrency: 8  # Reduced from 20 to prevent OOM
  # Use shared ServiceAccount (created by knowledge-extract-worker)
  serviceAccount:
    create: false
    name: "copilot-workers"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    queueLength: 5
    scaleDownDelay: 240
    scaleUpDelay: 10

integrationsCronJobs:
  enabled: true
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 900
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 900
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
  jobs:
    - name: refresh-tokens
      schedule: "0 */4 * * *"
    - name: sync-messaging-channels-all-orgs
      schedule: "0 6 * * *"
    - name: sync-deal-messages-all-orgs
      schedule: "*/30 * * * *"
    - name: renew-microsoft-graph-subscriptions
      schedule: "0 */12 * * *"
    - name: renew-google-subscriptions
      schedule: "0 2 * * *"
    - name: sync-hubspot-core-incremental-all-orgs
      resourceName: sync-hubspot-core-incremental
      schedule: "*/10 * * * *"
    - name: reconcile-hubspot-deletions-all-orgs
      resourceName: reconcile-hubspot-deletions
      schedule: "17 */12 * * *"

knowledgeCronJobs:
  enabled: true
  timeZone: "Etc/UTC"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 900
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 900
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  jobs:
    - name: cleanup-stale-knowledge-jobs
      schedule: "0,30 * * * *"
    - name: cleanup-stale-db-connections-every-10-min
      resourceName: cleanup-stale-db-connections
      schedule: "*/10 * * * *"

