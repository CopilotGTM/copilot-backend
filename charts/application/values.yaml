# Flower (Celery monitoring UI)
# Note: workers must have events enabled (set global.celery.enableEvents=true) for Flower to show task activity.
flower:
  enabled: false
  replicaCount: 1
  image:
    repository: "mher/flower"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5555
  ingress:
    enabled: false
    className: "azure-application-gateway"
    annotations:
      appgw.ingress.kubernetes.io/backend-protocol: "http"
    hosts: []
    tls: []
  auth:
    enabled: false
    basicAuth: ""
  config:
    secretName: "" # defaults to global.secretName when empty
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
