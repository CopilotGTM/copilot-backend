{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flower.fullname" . }}
  labels:
    {{- include "flower.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flower.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flower.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: flower
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: REDIS_ENABLE_TLS
              value: {{ .Values.global.redis.enableTLS | default false | quote }}
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              host="${REDIS_HOST:-localhost}"
              port="${REDIS_PORT:-6379}"
              pass=""
              if [ -n "${REDIS_PASSWORD:-}" ]; then pass=":${REDIS_PASSWORD}@"; fi
              if [ "${REDIS_ENABLE_TLS:-false}" = "true" ] || [ "${port}" = "6380" ]; then
                scheme="rediss"
              else
                scheme="redis"
              fi
              broker="${scheme}://${pass}${host}:${port}/0"
              exec celery --broker="${broker}" flower \
                --address=0.0.0.0 \
                --port={{ .Values.service.port }} \
                {{- if and .Values.auth.enabled .Values.auth.basicAuth }}
                --basic_auth={{ .Values.auth.basicAuth | quote }} \
                {{- end }}
                --loglevel=info
          envFrom:
            - secretRef:
                name: {{ .Values.config.secretName | default .Values.global.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
