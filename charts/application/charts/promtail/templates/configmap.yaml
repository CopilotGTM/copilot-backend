{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "promtail.fullname" . }}-config
  labels:
    {{- include "promtail.labels" . | nindent 4 }}
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: {{ include "promtail.lokiUrl" . }}

    scrape_configs:
      # Scrape logs from Kubernetes pods
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Try to parse JSON logs (when LOG_FORMAT=json is set)
          - json:
              expressions:
                level: level
                logger: logger
                request_id: request_id
                celery_task_id: celery_task_id
                celery_task_name: celery_task_name
                celery_queue: celery_queue
          # Add parsed fields as labels (only if they exist)
          - labels:
              level:
              logger:
            # Keep original log line (JSON when LOG_FORMAT=json) for full context
        relabel_configs:
          # Keep only pods in the same namespace as the release
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: {{ .Release.Namespace }}
          # Only collect logs from copilot app pods (api, workers, flower, beats)
          # Exclude infrastructure pods (loki, promtail, grafana)
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: (api|.*-worker|.*-beat|flower)
          # Use pod name
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Use container name
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # Use namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          # Add node name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          # Set app label: "copilot-backend" for API, "worker" for workers (for overview queries)
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
            regex: api
            replacement: copilot-backend
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
            regex: .*-worker
            replacement: worker
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
            regex: .*-beat
            replacement: worker
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
            regex: flower
            replacement: flower
          # Use app.kubernetes.io/name directly as instance label
          # This gives us: api, deal-worker, chat-worker, integrations-worker, etc.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: instance
          {{- range $key, $value := .Values.extraLabels }}
          # Static label: {{ $key }}
          - target_label: {{ $key }}
            replacement: {{ $value }}
          {{- end }}
          # Set path to container logs
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
{{- end }}
