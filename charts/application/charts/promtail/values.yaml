enabled: false

image:
  repository: grafana/promtail
  tag: "2.9.4"
  pullPolicy: IfNotPresent

# Loki endpoint configuration
loki:
  # Service name - defaults to release-loki if not specified
  serviceName: ""
  port: 3100

# Labels to add to all collected logs
extraLabels:
  environment: development
  cluster: aks

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Tolerations to run on all nodes including masters
tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists
