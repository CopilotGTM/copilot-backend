enabled: false
replicaCount: 1

image:
  repository: grafana/loki
  tag: "2.9.4"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3100

# Persistence for log storage
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""  # Uses default storage class if empty

# Loki configuration
config:
  # Retention period for logs
  retentionPeriod: 168h  # 7 days
  # Maximum log streams per user
  maxStreamsPerUser: 10000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
