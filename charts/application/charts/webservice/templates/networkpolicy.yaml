{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webservice.fullname" . }}-internal-health
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      {{- include "webservice.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  # Allow internal health checks from monitoring systems
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Values.networkPolicy.monitoringNamespace | default "monitoring" }}
    ports:
    - protocol: TCP
      port: 8080
  # Allow health checks from same namespace (internal cluster services)
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Values.namespace }}
    ports:
    - protocol: TCP
      port: 8080
  # Allow traffic from Azure Application Gateway (WAF)
  # AGIC injects traffic from the AppGW subnet - allow all VNet traffic
  - from:
    - ipBlock:
        cidr: 10.0.0.0/16  # VNet CIDR - includes AppGW subnet
    ports:
    - protocol: TCP
      port: 8080
  # Allow health checks from kube-system (for AGIC health probes)
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 8080
  {{- if .Values.networkPolicy.envoyGateway.enabled }}
  # Allow Envoy Gateway data-plane traffic to reach the API service.
  - from:
    - namespaceSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.envoyGateway.namespaceSelector.matchLabels | nindent 10 }}
    ports:
    - protocol: TCP
      port: 8080
  {{- end }}
{{- end }}
