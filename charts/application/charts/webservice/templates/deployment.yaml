apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webservice.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.strategy }}
  strategy:
    type: {{ .Values.strategy.type | default "RollingUpdate" }}
    {{- if eq (default "RollingUpdate" .Values.strategy.type) "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge | default 1 }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable | default 1 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "webservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "webservice.annotations" . | nindent 8 }}
      labels:
        {{- include "webservice.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
              value: "*"
            - name: AZURE_LOG_LEVEL
              value: "info"
            {{- if .Values.workloadIdentity.clientId }}
            - name: AZURE_CLIENT_ID
              value: {{ .Values.workloadIdentity.clientId | quote }}
            {{- if .Values.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.workloadIdentity.tenantId | quote }}
            {{- end }}
            {{- end }}
            # Graceful shutdown settings
            - name: WORKER_CONNECTIONS_CLOSE_WAIT
              value: "10"
            - name: KEEP_ALIVE_TIMEOUT
              value: "75"
          envFrom:
            - secretRef:
                name: {{ include "webservice.fullname" . }}-secret
          # Startup probe: allows up to 5 minutes for application to start
          # This prevents liveness probe from killing the pod during slow startup
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          # Liveness probe: checks if application is still running
          # Increased timeout to 45s and failureThreshold to 4 to handle GC pauses,
          # event loop blocking, and temporary freezes without unnecessary restarts
          # Total tolerance: 4 failures * 30s period = ~2 minutes before restart
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 45
            failureThreshold: 4
          # Readiness probe: checks if application can accept traffic
          # Increased timeout to 15s for better tolerance
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Gracefully shutting down FastAPI application..."
                    # Send SIGTERM to uvicorn process and wait
                    pkill -TERM -f "uvicorn\|fastapi" || true
                    sleep 15
