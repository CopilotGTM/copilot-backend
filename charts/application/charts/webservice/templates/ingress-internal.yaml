{{- if .Values.internalIngress.enabled -}}
# Note: For Azure Application Gateway, internal endpoints should be accessed
# via Kubernetes Services directly. This ingress is optional and can be
# used with a private Application Gateway for internal-only access.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "webservice.fullname" . }}-internal
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-health
  annotations:
    # For private/internal Application Gateway only
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    {{- toYaml .Values.internalIngress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.internalIngress.className }}
  rules:
  {{- range .Values.internalIngress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      - path: /internal
        pathType: Prefix
        backend:
          service:
            name: {{ include "webservice.fullname" $ }}
            port:
              number: {{ $.Values.service.port }}
  {{- end }}
{{- end }}
