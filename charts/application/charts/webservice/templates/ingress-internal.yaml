{{- if .Values.internalIngress.enabled -}}
# Internal ingress for health/monitoring endpoints.
# Access via Kubernetes Services is preferred for internal communication.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "webservice.fullname" . }}-internal
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
    app.kubernetes.io/component: internal-health
  {{- with .Values.internalIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.internalIngress.className }}
  rules:
  {{- range .Values.internalIngress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      - path: /internal
        pathType: Prefix
        backend:
          service:
            name: {{ include "webservice.fullname" $ }}
            port:
              number: {{ $.Values.service.port }}
  {{- end }}
{{- end }}
