{{- range $jobName, $jobConfig := .Values.jobs }}
{{- if $jobConfig.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "webservice.fullname" $ }}-{{ $jobName }}
  labels:
    {{- include "webservice.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $jobConfig.hook | default "pre-install,pre-upgrade" | quote }}
    "helm.sh/hook-weight": {{ $jobConfig.hookWeight | default "-5" | quote }}
    "helm.sh/hook-delete-policy": {{ $jobConfig.hookDeletePolicy | default "before-hook-creation" | quote }}
spec:
  backoffLimit: {{ $jobConfig.backoffLimit | default 1 }}
  activeDeadlineSeconds: {{ $jobConfig.activeDeadlineSeconds | default 900 }}
  template:
    metadata:
      name: {{ include "webservice.fullname" $ }}-{{ $jobName }}
      labels:
        app.kubernetes.io/name: {{ printf "%s-%s" (include "webservice.name" $) $jobName | trunc 63 | trimSuffix "-" }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: helm-hook
        app.kubernetes.io/part-of: {{ include "webservice.name" $ }}
        {{- if $.Values.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $.Values.serviceAccount.name | default (include "webservice.fullname" $) }}
      containers:
        - name: {{ $jobName }}-container
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            {{- toYaml $jobConfig.command | nindent 12 }}
          args:
            {{- toYaml $jobConfig.args | nindent 12 }}
          {{- if $.Values.workloadIdentity.clientId }}
          env:
            - name: AZURE_CLIENT_ID
              value: {{ $.Values.workloadIdentity.clientId | quote }}
            {{- if $.Values.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ $.Values.workloadIdentity.tenantId | quote }}
            {{- end }}
            - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
              value: "*"
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "webservice.fullname" $ }}-secret
          {{- with $jobConfig.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
