{{- $mode := .Values.gateway.mode | default "disabled" -}}
{{- $mainEnabled := and .Values.gateway.enabled (or (eq $mode "cutover-prepare") (eq $mode "cutover-complete")) -}}
{{- if $mainEnabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.routeName }}
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.gatewayName }}
    sectionName: https
  hostnames:
  - {{ .Values.gateway.host | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: {{ .Values.gateway.timeouts.request | quote }}
      {{- if .Values.gateway.timeouts.backendRequest }}
      backendRequest: {{ .Values.gateway.timeouts.backendRequest | quote }}
      {{- end }}
    backendRefs:
    - name: {{ include "webservice.fullname" . }}
      port: {{ .Values.service.port }}
{{- end }}
