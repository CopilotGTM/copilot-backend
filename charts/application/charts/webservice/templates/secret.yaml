apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webservice.fullname" . }}-secret
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
type: Opaque
data:
{{- with .Values.secrets }}
{{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
{{- end }}
{{- end }}
