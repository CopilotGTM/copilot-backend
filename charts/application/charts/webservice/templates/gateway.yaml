{{- $mode := .Values.gateway.mode | default "disabled" -}}
{{- $mainEnabled := and .Values.gateway.enabled (or (eq $mode "cutover-prepare") (eq $mode "cutover-complete")) -}}
{{- $validationEnabled := and .Values.gateway.enabled .Values.gateway.validation.enabled (or (eq $mode "validation") (eq $mode "cutover-prepare")) -}}
{{- if or $mainEnabled $validationEnabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.gatewayName }}
  labels:
    {{- include "webservice.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
  {{- if $mainEnabled }}
  - name: https
    protocol: HTTPS
    port: 443
    hostname: {{ .Values.gateway.host | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ .Values.gateway.tlsSecretName }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  {{- if $validationEnabled }}
  - name: https-validation
    protocol: HTTPS
    port: 443
    hostname: {{ .Values.gateway.validation.host | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ .Values.gateway.validation.tlsSecretName }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
{{- end }}
