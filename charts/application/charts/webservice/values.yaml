# ------------------------------------------------------------------
# Default Values for the Generic Webservice Subchart
# ------------------------------------------------------------------
# These values serve as the defaults for any service deployed by this chart.
# They are intended to be OVERRIDDEN from the parent `application` chart's
# `values.yaml` file under a specific service key (e.g., `services.api`).
# ------------------------------------------------------------------
# Custom annotations to be added to all resources
annotations: {}
# Overrides for chart naming conventions.
# It is recommended to use a fullnameOverride rather than overriding the name.
nameOverride: ""
fullnameOverride: ""
chartLabel: copilot-backend-0.1.0
name: copilot-backend
namespace: copilotgtm
labels:
  name: copilot-backend
  instance: copilot-backend
containerName: copilot-backend
environment: development
replicaCount: 2  # Minimum 2 for high availability during restarts

# Rolling update strategy - prevents resource deadlock during deploys
# With maxUnavailable: 1, Kubernetes can terminate old pods before new ones are fully ready
# This avoids needing 3x resources during rollout (2 old + 1 new)
strategy:
  type: RollingUpdate
  maxSurge: 1         # Allow 1 extra pod during rollout
  maxUnavailable: 1   # Allow 1 pod to be unavailable during rollout

image:
  repository: "copilotgtmacrdev.azurecr.io/copilot-backend"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Internal service for health checks (cluster-internal only)
# Note: Uses same port as main service since app runs on single port 8080
internalService:
  type: ClusterIP
  port: 8080  # Same port as application (8080) - app serves both public and internal endpoints
  annotations:
    # Service mesh or monitoring tool annotations can go here
    prometheus.io/scrape: "true"
    prometheus.io/path: "/internal/health/detailed"
    prometheus.io/port: "8080"

# Network policy configuration for enhanced security
networkPolicy:
  enabled: true
  monitoringNamespace: "monitoring"  # Namespace where monitoring tools run
  envoyGateway:
    enabled: false
    namespaceSelector:
      matchLabels:
        name: envoy-gateway-system

ingress:
  enabled: true
  className: "azure-application-gateway"
  annotations:
    # Azure Application Gateway (WAF) annotations
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/request-timeout: "3600"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    appgw.ingress.kubernetes.io/cookie-based-affinity: "false"
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
    # WebSocket support
    appgw.ingress.kubernetes.io/backend-hostname: "copilot-backend"
    # SSL/TLS - cert-manager creates the secret, AGIC uses it
    cert-manager.io/cluster-issuer: "letsencrypt"
  hosts:
    - host: "devapi.copilotgtm.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - "devapi.copilotgtm.com"
      secretName: "devapi-tls"

gateway:
  enabled: false
  mode: disabled
  disableLegacyIngress: false
  gatewayName: copilot-backend
  gatewayClassName: envoy-gateway-dev
  host: "devapi.copilotgtm.com"
  tlsSecretName: "devapi-tls"
  routeName: copilot-backend
  timeouts:
    request: "3600s"
    backendRequest: ""
  validation:
    enabled: false
    gatewayName: copilot-backend-envoy-validation
    host: "devapi-envoy.copilotgtm.com"
    tlsSecretName: "devapi-envoy-tls"
    routeName: copilot-backend-envoy-validation

# Internal ingress - disabled by default with WAF
# Use Kubernetes Services for internal communication instead
internalIngress:
  enabled: false
  className: "azure-application-gateway"
  annotations:
    appgw.ingress.kubernetes.io/backend-protocol: "http"
  hosts:
    - host: "internal.copilotgtm.local"

# HPA for autoscaling - enabled for high availability
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 512m
    memory: 1024Mi
  requests:
    cpu: 256m
    memory: 512Mi

secrets: {}

serviceAccount:
  create: true
  name: "copilot-backend"

# A map of jobs to run as Helm hooks.
# Each key represents a job that can be configured from the parent chart.
# Example:
# jobs:
#   migrations:
#     enabled: true
#     command: ["./run-migrations.sh"]
jobs: {}
