{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-datasources
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: {{ include "grafana.lokiUrl" . }}
        isDefault: true
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: request_id
              matcherRegex: '"request_id":"([^"]+)"'
              url: ''
            - name: celery_task_id
              matcherRegex: '"celery_task_id":"([^"]+)"'
              url: ''
{{- end }}
