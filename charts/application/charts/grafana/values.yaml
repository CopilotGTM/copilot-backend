enabled: false
replicaCount: 1

image:
  repository: grafana/grafana
  tag: "10.3.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

# Admin credentials (override in production)
admin:
  user: admin
  password: admin

# Loki datasource configuration
loki:
  # Service name - defaults to release-loki if not specified
  serviceName: ""
  port: 3100

# Persistence for dashboards and settings
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

# Disable analytics and update checks
config:
  disableGravatar: true
  disableAnalytics: true
  checkForUpdates: false

# Ingress configuration (disabled by default - use port-forward)
ingress:
  enabled: false
  className: "azure-application-gateway"
  annotations:
    appgw.ingress.kubernetes.io/backend-protocol: "http"
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
