{{- if and .Values.enabled .Values.autoscaling.enabled .Values.global.redis.usePassword -}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "worker.fullname" . }}-redis-auth
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.config.secretName | default .Values.global.secretName }}
      key: REDIS_PASSWORD
{{- end }}
