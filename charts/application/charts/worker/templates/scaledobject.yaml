{{- if and .Values.enabled .Values.autoscaling.enabled -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "worker.fullname" . }}-scaler
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "worker.fullname" . }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  {{- if .Values.autoscaling.scaleDownDelay }}
  cooldownPeriod: {{ .Values.autoscaling.scaleDownDelay }}
  {{- end }}
  {{- if .Values.autoscaling.scaleUpDelay }}
  pollingInterval: {{ .Values.autoscaling.scaleUpDelay }}
  {{- end }}
  triggers:
    - type: redis
      metadata:
        address: "{{ .Values.global.redis.host }}:{{ .Values.global.redis.port }}"
        listName: {{ .Values.config.queueName | quote }}
        listLength: {{ .Values.autoscaling.queueLength | quote }}
        {{- if .Values.global.redis.enableTLS }}
        enableTLS: "true"
        {{- end }}
      {{- if .Values.global.redis.usePassword }}
      authenticationRef:
        name: {{ include "worker.fullname" . }}-redis-auth
      {{- end }}
{{- end }}
