{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "worker.fullname" .) }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "celery"
            - "-A"
            {{- if contains "knowledge" .Values.config.queueName }}
            - "src.workers.knowledge_worker.celery_app"
            {{- else if contains "organization" .Values.config.queueName }}
            - "src.workers.organization_worker.celery_app"
            {{- else if contains "attachments" .Values.config.queueName }}
            - "src.workers.chat_worker.celery_app"
            {{- else if contains "chat" .Values.config.queueName }}
            - "src.workers.chat_worker.celery_app"
            {{- else if contains "content" .Values.config.queueName }}
            - "src.workers.content_worker.celery_app"
            {{- else }}
            - "src.workers.knowledge_worker.celery_app"
            {{- end }}
            - "worker"
            - "-l"
            - "info"
            {{- if .Values.config.concurrency }}
            - "--concurrency={{ .Values.config.concurrency }}"
            {{- end }}
            {{- if .Values.config.pool }}
            - "--pool={{ .Values.config.pool }}"
            {{- end }}
            - "-Q"
            - "{{ .Values.config.queueName }}" # Consumes from a specific queue
          envFrom:
            - secretRef:
                name: {{ .Values.config.secretName | default .Values.global.secretName }}
          {{- if .Values.workloadIdentity.clientId }}
          env:
            - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
              value: "*"
            - name: AZURE_LOG_LEVEL
              value: "info"
            - name: AZURE_CLIENT_ID
              value: {{ .Values.workloadIdentity.clientId | quote }}
            {{- if .Values.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.workloadIdentity.tenantId | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}