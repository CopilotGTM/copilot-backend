{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.updateStrategy.maxSurge }}
      maxUnavailable: {{ .Values.updateStrategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "worker.fullname" .) }}
      {{- end }}
      {{- $priorityClassName := .Values.priorityClassName | default "" }}
      {{- if and (not $priorityClassName) (.Values.global.priorityClasses.enabled | default false) }}
      {{- $priorityClassName = .Values.global.priorityClasses.worker.name }}
      {{- end }}
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}
      {{- if .Values.shutdown.enabled }}
      terminationGracePeriodSeconds: {{ .Values.shutdown.gracefulPeriodSeconds | default 600 }}
      {{- end }}
      {{- if .Values.gpu.enabled }}
      {{- if .Values.gpu.nodeSelector }}
      # Node selector to target GPU node pool
      nodeSelector:
        {{- toYaml .Values.gpu.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.gpu.tolerations }}
      # Tolerations to allow scheduling on tainted GPU nodes
      tolerations:
        {{- toYaml .Values.gpu.tolerations | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $workerApp := "src.workers.knowledge_worker.celery_app:app" }}
      {{- if contains "knowledge" .Values.config.queueName }}
      {{- $workerApp = "src.workers.knowledge_worker.celery_app:app" }}
      {{- else if contains "organization" .Values.config.queueName }}
      {{- $workerApp = "src.workers.organization_worker.celery_app:app" }}
      {{- else if contains "integration" .Values.config.queueName }}
      {{- $workerApp = "src.workers.integrations_worker.celery_app:app" }}
      {{- else if contains "deal" .Values.config.queueName }}
      {{- $workerApp = "src.workers.deal_worker.celery_app:app" }}
      {{- else if contains "attachments" .Values.config.queueName }}
      {{- $workerApp = "src.workers.chat_worker.celery_app:app" }}
      {{- else if contains "chat" .Values.config.queueName }}
      {{- $workerApp = "src.workers.chat_worker.celery_app:app" }}
      {{- end }}
      {{- $heartbeatLiveness := eq (.Values.probes.livenessMode | default "celeryPing") "heartbeat" }}
      {{- $probeApp := $workerApp }}
      {{- if $heartbeatLiveness }}
      {{- $probeApp = "src.workers.base.healthcheck_app:app" }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- if .Values.config.command }}
            {{- toYaml .Values.config.command | nindent 12 }}
            {{- else }}
            - "celery"
            - "-A"
            - {{ $workerApp | quote }}
            {{- if .Values.config.beatMode }}
            # Celery Beat scheduler mode - uses schedule from app config
            - "beat"
            - "-l"
            - "info"
            - "-s"
            - "/tmp/celerybeat-schedule"
            {{- else }}
            - "worker"
            - "-l"
            - "info"
            {{- if or (.Values.config.enableEvents | default false) (.Values.global.celery.enableEvents | default false) $heartbeatLiveness }}
            - "-E"
            {{- end }}
            {{- if .Values.config.concurrency }}
            - "--concurrency={{ .Values.config.concurrency }}"
            {{- end }}
            {{- if .Values.config.pool }}
            - "--pool={{ .Values.config.pool }}"
            {{- end }}
            {{- if .Values.config.maxTasksPerChild }}
            - "--max-tasks-per-child={{ .Values.config.maxTasksPerChild }}"
            {{- end }}
            {{- if .Values.config.maxMemoryPerChildKb }}
            - "--max-memory-per-child={{ .Values.config.maxMemoryPerChildKb }}"
            {{- end }}
            - "-Q"
            - "{{ .Values.config.queueName }}{{- if .Values.config.additionalQueues }},{{ join "," .Values.config.additionalQueues }}{{- end }}"
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.config.secretName | default .Values.global.secretName }}
          {{- $memoryLogging := .Values.config.memoryLogging | default dict }}
          {{- if or .Values.workloadIdentity.clientId .Values.config.gracefulTimeout ($memoryLogging.enabled | default false) .Values.config.env }}
          env:
            {{- with .Values.config.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.workloadIdentity.clientId }}
            - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
              value: "*"
            - name: AZURE_LOG_LEVEL
              value: "info"
            - name: AZURE_CLIENT_ID
              value: {{ .Values.workloadIdentity.clientId | quote }}
            {{- if .Values.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.workloadIdentity.tenantId | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.gracefulTimeout }}
            - name: CELERYD_WORKER_SHUTDOWN_TIMEOUT
              value: {{ .Values.config.gracefulTimeout | quote }}
            {{- end }}
            {{- if ($memoryLogging.enabled | default false) }}
            - name: CELERY_TASK_MEMORY_LOGGING_ENABLED
              value: "true"
            - name: CELERY_TASK_MEMORY_LOGGING_MIN_DELTA_MB
              value: {{ ($memoryLogging.minDeltaMb | default 0) | quote }}
            {{- end }}
          {{- end }}
          {{- if and (.Values.probes.enabled | default true) (not .Values.config.beatMode) }}
          livenessProbe:
            exec:
              command:
                {{- if .Values.probes.livenessCommand }}
                {{- toYaml .Values.probes.livenessCommand | nindent 16 }}
                {{- else }}
                - /bin/sh
                - -c
                {{- if $heartbeatLiveness }}
                - >-
                  python -c 'import os,sys,time; path="/tmp/celery-worker-heartbeat"; sys.exit(not os.path.exists(path) or time.time() - os.path.getmtime(path) > {{ .Values.probes.heartbeatMaxAgeSeconds | default 120 }})'
                {{- else }}
                - >-
                  celery -A {{ $workerApp }} inspect ping --destination "celery@$HOSTNAME" --timeout={{ .Values.probes.timeoutSeconds | default 10 }} >/dev/null
                {{- end }}
                {{- end }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.probes.periodSeconds | default 30 }}
            {{- if $heartbeatLiveness }}
            timeoutSeconds: {{ .Values.probes.livenessTimeoutSeconds | default 5 }}
            {{- else }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds | default 10 }}
            {{- end }}
            failureThreshold: {{ .Values.probes.failureThreshold | default 3 }}
          readinessProbe:
            exec:
              command:
                {{- if .Values.probes.readinessCommand }}
                {{- toYaml .Values.probes.readinessCommand | nindent 16 }}
                {{- else }}
                - /bin/sh
                - -c
                - >-
                  celery -A {{ $probeApp }} inspect ping --destination "celery@$HOSTNAME" --timeout={{ .Values.probes.readinessPingTimeoutSeconds | default 10 }} >/dev/null
                {{- end }}
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.probes.readinessPeriodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.probes.readinessFailureThreshold | default 2 }}
          {{- end }}
          {{- if and .Values.shutdown.enabled (not .Values.config.beatMode) (not .Values.config.command) }}
          {{- $drainQueues := list .Values.config.queueName }}
          {{- if .Values.config.additionalQueues }}
          {{- $drainQueues = concat $drainQueues .Values.config.additionalQueues }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    WORKER_NODE="celery@$HOSTNAME";
                    echo "[preStop] Draining Celery worker $WORKER_NODE: stopping consumers for queues {{ join "," $drainQueues }}";
                    {{- range $queue := $drainQueues }}
                    celery -A {{ $workerApp }} control cancel_consumer {{ $queue }} --destination "$WORKER_NODE" || true;
                    {{- end }}
                    {{- if .Values.shutdown.remoteShutdown }} echo "[preStop] Optional remote shutdown after drain"; celery -A \
                    {{ $workerApp }} control shutdown --destination "$WORKER_NODE" || true; {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
