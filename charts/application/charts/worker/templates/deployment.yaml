{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.updateStrategy.maxSurge | default 1 }}
      maxUnavailable: {{ .Values.updateStrategy.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "worker.fullname" .) }}
      {{- end }}
      {{- if .Values.shutdown.enabled }}
      terminationGracePeriodSeconds: {{ .Values.shutdown.gracefulPeriodSeconds | default 600 }}
      {{- end }}
      {{- if .Values.gpu.enabled }}
      {{- if .Values.gpu.nodeSelector }}
      # Node selector to target GPU node pool
      nodeSelector:
        {{- toYaml .Values.gpu.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.gpu.tolerations }}
      # Tolerations to allow scheduling on tainted GPU nodes
      tolerations:
        {{- toYaml .Values.gpu.tolerations | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "celery"
            - "-A"
            {{- if contains "knowledge" .Values.config.queueName }}
            - "src.workers.knowledge_worker.celery_app:app"
            {{- else if contains "organization" .Values.config.queueName }}
            - "src.workers.organization_worker.celery_app:app"
            {{- else if contains "integration" .Values.config.queueName }}
            - "src.workers.integrations_worker.celery_app:app"
            {{- else if contains "deal" .Values.config.queueName }}
            - "src.workers.deal_worker.celery_app:app"
            {{- else if contains "attachments" .Values.config.queueName }}
            - "src.workers.chat_worker.celery_app:app"
            {{- else if contains "chat" .Values.config.queueName }}
            - "src.workers.chat_worker.celery_app:app"
            {{- else }}
            - "src.workers.knowledge_worker.celery_app:app"
            {{- end }}
            {{- if .Values.config.beatMode }}
            # Celery Beat scheduler mode - uses schedule from app config
            - "beat"
            - "-l"
            - "info"
            - "-s"
            - "/tmp/celerybeat-schedule"
            {{- else }}
            - "worker"
            - "-l"
            - "info"
            {{- if or (.Values.config.enableEvents | default false) (.Values.global.celery.enableEvents | default false) }}
            - "-E"
            {{- end }}
            {{- if .Values.config.concurrency }}
            - "--concurrency={{ .Values.config.concurrency }}"
            {{- end }}
            {{- if .Values.config.pool }}
            - "--pool={{ .Values.config.pool }}"
            {{- end }}
            - "-Q"
            - "{{ .Values.config.queueName }}{{- if .Values.config.additionalQueues }},{{ join "," .Values.config.additionalQueues }}{{- end }}"
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.config.secretName | default .Values.global.secretName }}
          {{- $memoryLogging := .Values.config.memoryLogging | default dict }}
          {{- if or .Values.workloadIdentity.clientId .Values.config.gracefulTimeout ($memoryLogging.enabled | default false) }}
          env:
            {{- if .Values.workloadIdentity.clientId }}
            - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
              value: "*"
            - name: AZURE_LOG_LEVEL
              value: "info"
            - name: AZURE_CLIENT_ID
              value: {{ .Values.workloadIdentity.clientId | quote }}
            {{- if .Values.workloadIdentity.tenantId }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.workloadIdentity.tenantId | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.gracefulTimeout }}
            - name: CELERYD_WORKER_SHUTDOWN_TIMEOUT
              value: {{ .Values.config.gracefulTimeout | quote }}
            {{- end }}
            {{- if ($memoryLogging.enabled | default false) }}
            - name: CELERY_TASK_MEMORY_LOGGING_ENABLED
              value: "true"
            - name: CELERY_TASK_MEMORY_LOGGING_MIN_DELTA_MB
              value: {{ ($memoryLogging.minDeltaMb | default 0) | quote }}
            {{- end }}
          {{- end }}
          {{- if and .Values.shutdown.enabled (not .Values.config.beatMode) }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    echo "[preStop] Draining Celery worker: stopping consumer for queue {{ .Values.config.queueName }}";
                    celery -A \
                    {{- if contains "knowledge" .Values.config.queueName }} src.workers.knowledge_worker.celery_app:app \
                    {{- else if contains "organization" .Values.config.queueName }} src.workers.organization_worker.celery_app:app \
                    {{- else if contains "integration" .Values.config.queueName }} src.workers.integrations_worker.celery_app:app \
                    {{- else if contains "deal" .Values.config.queueName }} src.workers.deal_worker.celery_app:app \
                    {{- else if contains "attachments" .Values.config.queueName }} src.workers.chat_worker.celery_app:app \
                    {{- else if contains "chat" .Values.config.queueName }} src.workers.chat_worker.celery_app:app \
                    {{- else }} src.workers.knowledge_worker.celery_app:app \
                    {{- end }} control cancel_consumer {{ .Values.config.queueName }} || true;
                    {{- if .Values.shutdown.remoteShutdown }} echo "[preStop] Optional remote shutdown after drain"; celery -A \
                    {{- if contains "knowledge" .Values.config.queueName }} src.workers.knowledge_worker.celery_app:app \
                    {{- else if contains "organization" .Values.config.queueName }} src.workers.organization_worker.celery_app:app \
                    {{- else if contains "integration" .Values.config.queueName }} src.workers.integrations_worker.celery_app:app \
                    {{- else if contains "deal" .Values.config.queueName }} src.workers.deal_worker.celery_app:app \
                    {{- else if contains "attachments" .Values.config.queueName }} src.workers.chat_worker.celery_app:app \
                    {{- else if contains "chat" .Values.config.queueName }} src.workers.chat_worker.celery_app:app \
                    {{- else }} src.workers.knowledge_worker.celery_app:app \
                    {{- end }} control shutdown || true; {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
