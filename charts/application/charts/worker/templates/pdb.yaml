{{- if and .Values.enabled .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  minAvailable: {{ if hasKey .Values.pdb "minAvailable" }}{{ .Values.pdb.minAvailable }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
{{- end }}
