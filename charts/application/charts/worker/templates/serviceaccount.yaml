{{- /*
ServiceAccount creation previously gated by both .Values.enabled and .Values.serviceAccount.create.
Because parent chart disables the generic worker subchart (enabled=false) while still deploying
multiple specific worker deployments that reference the shared ServiceAccount name (e.g. copilot-workers),
the SA wasn't rendered, causing Helm upgrade failure: no ServiceAccount with the name "copilot-workers" found.

We relax the condition so that if serviceAccount.create is true we always render the ServiceAccount,
independent of the generic worker "enabled" flag. This allows using the subchart purely as an SA provider.
*/ -}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "worker.fullname" .) }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.workloadIdentity.clientId }}
  annotations:
    {{- if .Values.workloadIdentity.clientId }}
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}