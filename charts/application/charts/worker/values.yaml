# Default values for a generic worker.
# These values will be overridden by the parent chart.

enabled: false

replicaCount: 1

# Optional override names (added to avoid 'Value not defined' lint errors when unset)
nameOverride: ""
fullnameOverride: ""

image:
  repository: "" # Must be overridden
  tag: "latest"
  pullPolicy: IfNotPresent

# Configuration specific to the worker
config:
  queueName: "default" # Should be overridden
  secretName: "" # Will be populated by global value
  # Optional Celery execution tuning
  concurrency: null
  pool: null
  maxTasksPerChild: null
  maxMemoryPerChildKb: null
  enableEvents: true
  # Time (seconds) Celery will wait for running tasks to finish after SIGTERM before cold shutdown.
  # Set lower than shutdown.gracefulPeriodSeconds (leave null to use Celery default ~10s -> may be too short for long tasks)
  gracefulTimeout: 540
  # Beat mode - set to true for Celery Beat scheduler (runs periodic tasks)
  beatMode: false
  # Schedule interval for beat mode (seconds) - default 2 hours
  scheduleInterval: 7200
  memoryLogging:
    enabled: false
    minDeltaMb: 0

global:
  secretName: "" # Will be populated by parent chart
  celery:
    enableEvents: false
  priorityClasses:
    enabled: false
    worker:
      name: copilot-worker
      preemptionPolicy: Never

resources:
  limits:
    cpu: 256m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 256Mi

priorityClassName: ""

probes:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 20
  failureThreshold: 4
  readinessInitialDelaySeconds: 30
  readinessPeriodSeconds: 30
  readinessFailureThreshold: 3

# GPU Configuration (optional)
# Enable GPU support for workers that require GPU resources
gpu:
  enabled: false
  # Node selector to target specific GPU node pools
  nodeSelector: {}
    # Example:
    # workload: knowledge-gpu
  # Tolerations to allow scheduling on tainted GPU nodes
  tolerations: []
    # Example:
    # - key: dedicated
    #   operator: Equal
    #   value: gpu
    #   effect: NoSchedule

# Rolling update strategy for the worker Deployment
updateStrategy:
  maxSurge: 1        # Allow one extra pod above desired during rollout so new workers start before old stop
  maxUnavailable: 0  # Ensure we never reduce available workers during rollout

# Graceful shutdown / draining behaviour
# When enabled the pod will:
# 1. Run a preStop hook that cancels consuming from the queue so no new tasks are taken.
# 2. Rely on Kubernetes sending SIGTERM afterwards; Celery will finish the active task.
# 3. After terminationGracePeriodSeconds (hard limit) Kubernetes will SIGKILL if still running.
shutdown:
  enabled: true
  gracefulPeriodSeconds: 600   # Hard time limit for a pod to finish an in‑flight task before force kill
  cancelConsumer: true         # Issue celery control cancel_consumer for the queue
  # (Advanced) If you want to attempt remote shutdown after draining, set to true. Off by default to avoid aborting tasks.
  remoteShutdown: false

# Pod Disruption Budget to avoid all workers being evicted simultaneously (voluntary disruptions)
# NOTE: minAvailable is set to 0 to allow cluster maintenance (node drains, upgrades)
# With minAvailable: 1 and replicaCount: 1, node drains would deadlock.
# Workers can tolerate brief restarts - tasks queue in Redis and retry on failure.
pdb:
  enabled: true
  minAvailable: 0

# ServiceAccount configuration (for workload identity / RBAC)
serviceAccount:
  create: true
  name: "copilot-workers"
  annotations: {}

# Workload Identity (optional) - set clientId to inject azure.workload.identity/client-id annotation
workloadIdentity:
  clientId: ""
  # Optional explicit tenant for workload identity tokens; populated via --set <worker>.workloadIdentity.tenantId=<GUID>
  tenantId: ""
  # Optionally control additional tenants allowed for token acquisition ("*" permits any). Currently not consumed in template.
  additionalAllowedTenants: ""

# KEDA-based autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # Target length of the Redis list (Celery queue)
  queueLength: 5
  # Scale down delay (time to wait before scaling down in seconds)
  scaleDownDelay: 300
  # Scale up delay (polling interval for checking metrics in seconds)
  scaleUpDelay: 30
