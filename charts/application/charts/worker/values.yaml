# Default values for a generic worker.
# These values will be overridden by the parent chart.

enabled: false

replicaCount: 1

image:
  repository: "" # Must be overridden
  tag: "latest"
  pullPolicy: IfNotPresent

# Configuration specific to the worker
config:
  queueName: "default" # Should be overridden
  secretName: "" # Will be populated by global value
  # Optional Celery execution tuning
  concurrency: null
  pool: null

global:
  secretName: "" # Will be populated by parent chart

resources:
  limits:
    cpu: 256m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 256Mi

# ServiceAccount configuration (for workload identity / RBAC)
serviceAccount:
  create: true
  name: "copilot-workers"
  annotations: {}

# Workload Identity (optional) - set clientId to inject azure.workload.identity/client-id annotation
workloadIdentity:
  clientId: ""
  # Optional explicit tenant for workload identity tokens; populated via --set <worker>.workloadIdentity.tenantId=<GUID>
  tenantId: ""
  # Optionally control additional tenants allowed for token acquisition ("*" permits any). Currently not consumed in template.
  additionalAllowedTenants: ""

# KEDA-based autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # Target length of the Redis list (Celery queue)
  queueLength: 5
  # Scale down delay (time to wait before scaling down in seconds)
  scaleDownDelay: 300
  # Scale up delay (polling interval for checking metrics in seconds)
  scaleUpDelay: 30