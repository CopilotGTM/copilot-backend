apiVersion: v2
name: application
description: A Helm chart for the entire application stack, including API and workers.
type: application
version: 0.1.0
appVersion: "1.16.0"

dependencies:
- name: webservice
  version: "0.1.0"
  repository: "file://./charts/webservice"
  alias: api
  condition: api.enabled
- name: flower
  version: "0.1.0"
  repository: "file://./charts/flower"
  condition: flower.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: knowledge-extract-worker
  condition: knowledge-extract-worker.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: knowledge-upload-worker
  condition: knowledge-upload-worker.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: knowledge-beat
  condition: knowledge-beat.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: organization-worker
  condition: organization-worker.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: chat-worker
  condition: chat-worker.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: chat-beat
  condition: chat-beat.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: integrations-worker
  condition: integrations-worker.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: deal-worker
  condition: deal-worker.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: deal-insights-worker
  condition: deal-insights-worker.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: deal-beat
  condition: deal-beat.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: integrations-beat
  condition: integrations-beat.enabled
