apiVersion: v2
name: application
description: A Helm chart for the entire application stack, including API and workers.
type: application
version: 0.1.0
appVersion: "1.16.0"

dependencies:
- name: webservice
  version: "0.1.0"
  repository: "file://./charts/webservice"
  alias: api
  # Condition path adjusted to reflect actual values structure (see values.yaml)
  condition: api.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: knowledge-extract-worker
  condition: workers.knowledge-extract.enabled
- name: worker
  version: "0.1.0"
  repository: "file://./charts/worker"
  alias: knowledge-upload-worker
  condition: workers.knowledge-upload.enabled
