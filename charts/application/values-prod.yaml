# =============================================================================
# PROD ENVIRONMENT OVERRIDES
# =============================================================================
# Production resource settings - higher availability and resource limits.
# Base values.yaml defines dev defaults; this file overrides for production.
#
# Usage: helm upgrade --install ... -f values.yaml -f values-prod.yaml
# =============================================================================

api:
  replicaCount: 2
  strategy:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  gateway:
    enabled: true
    mode: cutover-complete
    disableLegacyIngress: true
    gatewayName: copilot-backend
    gatewayClassName: envoy-gateway-prod
    host: api.copilotgtm.com
    tlsSecretName: api-tls
    routeName: copilot-backend
    timeouts:
      request: "3600s"
      backendRequest: ""
    validation:
      enabled: false
      gatewayName: copilot-backend-envoy-validation
      host: api-envoy.copilotgtm.com
      tlsSecretName: api-envoy-tls
      routeName: copilot-backend-envoy-validation
  networkPolicy:
    envoyGateway:
      enabled: true
  secrets:
    APP_URL: "https://app.copilotgtm.com"
    ADMIN_APP_URL: "https://admin.copilotgtm.com"
    ALLOW_ORIGIN_URL_AUTH: "https://app.copilotgtm.com,https://admin.copilotgtm.com"
    FROM_EMAIL: "noreply@team.copilotgtm.com"
    SUPER_ADMIN_EMAIL: "tech@copilotgtm.com"
    SENTRY_DSN: "https://d47183944100e4f69572365fd1634d16@o4511017432186880.ingest.us.sentry.io/4511017435070464"
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    VOICE_REALTIME_API_ENABLED: "false"
    # Non-secret Recall defaults; credentials still come from the pipeline/KV path.
    RECALL_REGION: "us-west-2"
    RECALL_TIMEOUT_SECONDS: "30"
    RECALL_BOT_NAME: "CopilotGTM Notetaker"
    OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp-gateway-prod-us-west-0.grafana.net/otlp"
    REDIS_SSL_CERT_REQS: "CERT_REQUIRED"
    DATABASE_POOL_SIZE: "1"
    DATABASE_MAX_OVERFLOW: "2"
    USE_SHARED_TENANT_DATABASE: "true"
    TENANT_DATABASE_USER: "app_tenant_runtime"
    TENANT_DATABASE_PASSWORD_SECRET_NAME: "shared-tenant-db-password"  # pragma: allowlist secret
    GOOGLE_REDIRECT_URI: "https://api.copilotgtm.com/users/integrations/copilot-oauth/callback"
    GOOGLE_CHAT_AUTH_AUDIENCE: "https://api.copilotgtm.com/users/bots/google-chat/events"
    GOOGLE_WEBHOOK_BASE_URL: "https://api.copilotgtm.com"
    GOOGLE_GMAIL_PUBSUB_TOPIC: "projects/copilotgtm/topics/gmail-push"
    GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION: "projects/copilotgtm/subscriptions/gmail-push-sub"
    GOOGLE_GMAIL_PUBSUB_PUSH_TOKEN_SECRET_NAME: "google-gmail-pubsub-push-token"  # pragma: allowlist secret
    MICROSOFT_REDIRECT_URI: "https://api.copilotgtm.com/users/integrations/copilot-oauth/callback"
    MICROSOFT_GRAPH_WEBHOOK_BASE_URL: "https://api.copilotgtm.com"
    SLACK_REDIRECT_URI: "https://api.copilotgtm.com/users/integrations/copilot-oauth/callback"
    SLACK_BOT_REDIRECT_URI: "https://api.copilotgtm.com/users/bots/slack/oauth/callback"
    HUBSPOT_REDIRECT_URI: "https://api.copilotgtm.com/users/integrations/copilot-oauth/callback"
    HUBSPOT_WEBHOOK_PUBLIC_URL: "https://api.copilotgtm.com/users/integrations/hubspot/webhook"
    SALESFORCE_REDIRECT_URI: "https://api.copilotgtm.com/users/integrations/copilot-oauth/callback"
    SALESFORCE_EXTERNAL_CLIENT_APP_INSTALL_URL: "https://login.salesforce.com/packaging/installPackage.apexp?p0=04tdM000000UHMnQAO"
    WHATSAPP_BOT_PHONE_NUMBER: "+918168144213"
  environment: production
  autoscaling:
    minReplicas: 1
    maxReplicas: 5
    # Scale on an absolute memory level so the 500Mi request is not treated as
    # the intended application capacity. Keep headroom below the 1Gi limit.
    targetMemoryUtilizationPercentage: null
    targetMemoryAverageValue: "800Mi"
  jobs:
    startup:
      env:
        - name: MIGRATION_DATABASE_PORT
          value: "5432"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "250m"
          memory: "1Gi"
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 300m
      memory: 1.5Gi

global:
  priorityClasses:
    enabled: true

knowledge-upload-worker:
  config:
    concurrency: 1
  autoscaling:
    minReplicas: 0
    maxReplicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "250Mi"
    limits:
      cpu: "750m"
      memory: "1.5Gi"

knowledge-extract-worker:
  config:
    concurrency: 1
  autoscaling:
    maxReplicas: 1

knowledge-beat:
  enabled: false
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"

chat-worker:
  config:
    concurrency: 10
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests:
      cpu: "100m"
      memory: "640Mi"
    limits:
      cpu: "250m"
      memory: "2Gi"

chat-beat:
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "100m"
      memory: "512Mi"

integrations-worker:
  # copilotgtm: Four I/O slots share one loop; raise only after provider and DB load tests.
  config:
    concurrency: 4
    maxTasksPerChild: null
    memoryLogging:
      enabled: true
      minDeltaMb: 0
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests:
      cpu: "250m"
      memory: "640Mi"
    limits:
      cpu: "500m"
      memory: "1.5Gi"

salesforce-cdc-worker:
  replicaCount: 1
  image:
    repository: "copilotgtmacrprod.azurecr.io/copilot-backend-integrations-worker"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "2Gi"

integrationsCronJobs:
  jobs:
    - name: refresh-tokens
      schedule: "0 */4 * * *"
    - name: recover-stale-webhook-syncs
      schedule: "*/5 * * * *"
    - name: renew-microsoft-graph-subscriptions
      schedule: "0 */12 * * *"
    - name: renew-google-subscriptions
      schedule: "0 2 * * *"

deal-worker:
  # copilotgtm: Four I/O slots share one loop; CPU-heavy work stays outside the loop.
  config:
    concurrency: 4
    memoryLogging:
      enabled: true
      minDeltaMb: 0
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests:
      cpu: "250m"
      memory: "768Mi"
    limits:
      cpu: "500m"
      memory: "1.5Gi"

deal-insights-worker:
  config:
    concurrency: 2
    memoryLogging:
      enabled: true
      minDeltaMb: 0
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "1Gi"

knowledgeCronJobs:
  jobs:
    - name: cleanup-stale-knowledge-jobs
      schedule: "0 */6 * * *"

dealCronJobs:
  jobs:
    - name: deal-mapping
      schedule: "3 */2 * * *"
    - name: stale-deal-job-cleanup
      schedule: "45 * * * *"
    - name: meeting-bot-fallback
      schedule: "0 20 * * *"
    - name: sales-dashboard-snapshot
      schedule: "15 1 * * *"

deal-beat:
  enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

integrations-beat:
  enabled: false
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"

organization-worker:
  config:
    concurrency: 1
  autoscaling:
    maxReplicas: 1

flower:
  enabled: false
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
