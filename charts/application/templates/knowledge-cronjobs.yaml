{{- if .Values.knowledgeCronJobs.enabled }}
{{- $root := . -}}
{{- $worker := index .Values "knowledge-upload-worker" -}}
{{- $workloadIdentity := (index .Values "knowledge-extract-worker").workloadIdentity -}}
{{- range $job := .Values.knowledgeCronJobs.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s" $root.Release.Name (default $job.name $job.resourceName) | trunc 52 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/name: knowledge-cronjob
    app.kubernetes.io/component: {{ $job.name }}
spec:
  schedule: {{ $job.schedule | quote }}
  timeZone: {{ $root.Values.knowledgeCronJobs.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $root.Values.knowledgeCronJobs.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $root.Values.knowledgeCronJobs.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ $root.Values.knowledgeCronJobs.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: {{ $root.Values.knowledgeCronJobs.backoffLimit }}
      activeDeadlineSeconds: {{ $root.Values.knowledgeCronJobs.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $root.Values.knowledgeCronJobs.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ $root.Release.Name }}
            app.kubernetes.io/name: knowledge-cronjob
            app.kubernetes.io/component: {{ $job.name }}
            {{- if $workloadIdentity.clientId }}
            azure.workload.identity/use: "true"
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $worker.serviceAccount.name | default "copilot-workers" }}
          containers:
            - name: {{ $job.name }}
              image: "{{ $worker.image.repository }}:{{ $worker.image.tag }}"
              imagePullPolicy: {{ $worker.image.pullPolicy }}
              command:
                - python
                - -m
                - src.workers.knowledge_worker.cron_dispatch
                - --job
                - {{ $job.name }}
              envFrom:
                - secretRef:
                    name: {{ $worker.config.secretName | default $root.Values.global.secretName }}
              {{- if $workloadIdentity.clientId }}
              env:
                - name: AZURE_ADDITIONALLY_ALLOWED_TENANTS
                  value: "*"
                - name: AZURE_LOG_LEVEL
                  value: "info"
                - name: AZURE_CLIENT_ID
                  value: {{ $workloadIdentity.clientId | quote }}
                {{- if $workloadIdentity.tenantId }}
                - name: AZURE_TENANT_ID
                  value: {{ $workloadIdentity.tenantId | quote }}
                {{- end }}
              {{- end }}
              resources:
                {{- toYaml $root.Values.knowledgeCronJobs.resources | nindent 16 }}
{{- end }}
{{- end }}
