{{- /*
Shared ServiceAccount for all worker deployments.
Created at the parent chart level to ensure it exists before any worker starts.

Uses the workloadIdentity.clientId from the knowledge-extract-worker since all workers
share the same workload identity. The backend pipeline passes this via:
  --set knowledge-extract-worker.workloadIdentity.clientId=$(WORKLOAD_IDENTITY_WORKERS_CLIENT_ID)
*/ -}}
{{- $clientId := (index .Values "knowledge-extract-worker").workloadIdentity.clientId | default "" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-workers
  labels:
    app.kubernetes.io/name: copilot-workers
    app.kubernetes.io/component: worker
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- if $clientId }}
    azure.workload.identity/use: "true"
    {{- end }}
  {{- if $clientId }}
  annotations:
    azure.workload.identity/client-id: {{ $clientId | quote }}
  {{- end }}
automountServiceAccountToken: true
