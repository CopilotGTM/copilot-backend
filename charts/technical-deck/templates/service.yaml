apiVersion: v1
kind: Service
metadata:
  name: {{ include "technical-deck.fullname" . }}
  labels:
    {{- include "technical-deck.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "technical-deck.selectorLabels" . | nindent 4 }}
