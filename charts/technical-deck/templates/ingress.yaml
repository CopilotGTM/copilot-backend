# charts/technical-deck/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technical-deck
  namespace: copilotgtm
  labels:
    app.kubernetes.io/name: technical-deck
    app.kubernetes.io/instance: technical-deck
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: technical-deck
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - devapi.copilotgtm.com
    secretName: devapi-tls
  rules:
  - host: devapi.copilotgtm.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: technical-deck
            port:
              number: 80
