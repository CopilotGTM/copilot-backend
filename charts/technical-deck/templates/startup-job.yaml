{{- if .Values.startupJob.enabled }}
{{- $baseName := printf "%s-startup-job-v2" .Release.Name -}}
{{- if .Values.startupJob.addRevisionSuffix }}
{{- $baseName = printf "%s-r%s" $baseName (.Release.Revision | toString) -}}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $baseName | quote }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.labels.name }}
    app.kubernetes.io/instance: {{ .Values.labels.instance }}
  annotations:
    # Run AFTER initial install resources (so the Secret & other manifests exist) and BEFORE upgrades.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    {{- if not .Values.startupJob.debug }}
    # Delete failed jobs so pipeline isn't blocked (debug mode off)
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
    {{- else }}
    # Keep failed job for inspection (debug mode on)
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  {{- if and .Values.startupJob.debug (gt (.Values.startupJob.ttlSecondsAfterFinished | int) 0) }}
  ttlSecondsAfterFinished: {{ .Values.startupJob.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      name: {{ $baseName | quote }}
      labels:
        app.kubernetes.io/name: {{ .Values.labels.name }}
        app.kubernetes.io/instance: {{ .Values.labels.instance }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: startup-job
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "[startup-job] Starting migrations & seeding at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              {{- if .Values.startupJob.debug }}
              echo "[startup-job][debug] ENVIRONMENT=$ENVIRONMENT"
              for v in DATABASE_HOST DATABASE_PORT DATABASE_NAME DATABASE_USER DATABASE_SSL_MODE; do
                if [ -n "${!v:-}" ]; then echo "[startup-job][debug] $v set"; else echo "[startup-job][warn] $v not set"; fi
              done
              {{- end }}
              if [ -f scripts/startup.sh ]; then
                chmod +x scripts/startup.sh
                ./scripts/startup.sh
              else
                echo "ERROR: scripts/startup.sh not found in working directory $(pwd)" >&2
                ls -al
                exit 1
              fi
              echo "[startup-job] Completed successfully at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
          envFrom:
            - secretRef:
                name: {{ include "technical-deck.secretName" . }}
{{- end }}
