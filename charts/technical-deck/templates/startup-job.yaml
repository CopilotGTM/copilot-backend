apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-startup-job
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.labels.name }}
    app.kubernetes.io/instance: {{ .Values.labels.instance }}
  annotations:
    # This is what defines this resource as a hook. Without this line, this
    # job would be created every time a helm upgrade is run.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
    # Removed unsupported helm.sh/hook-timeout (Helm ignores it); control timing with helm --timeout flag
spec:
  # Allow a single retry to handle transient DB readiness issues
  backoffLimit: 1
  # Hard deadline for the job (seconds) – keep aligned with helm upgrade --timeout
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: {{ .Release.Name }}-startup-job
      labels:
        app.kubernetes.io/name: {{ .Values.labels.name }}
        app.kubernetes.io/instance: {{ .Values.labels.instance }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: startup-job
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo "[startup-job] Starting migrations & seeding at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              if [ -f scripts/startup.sh ]; then
                chmod +x scripts/startup.sh
                ./scripts/startup.sh
              else
                echo "ERROR: scripts/startup.sh not found in working directory $(pwd)" >&2
                ls -al
                exit 1
              fi
              echo "[startup-job] Completed successfully at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
          envFrom:
            - secretRef:
                name: {{ include "technical-deck.fullname" . }}-secret
  # Removed previous backoffLimit placement (moved above) and explicit hook-timeout annotation
