apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-startup-job
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.labels.name }}
    app.kubernetes.io/instance: {{ .Values.labels.instance }}
  annotations:
    # This is what defines this resource as a hook. Without this line, this
    # job would be created every time a helm upgrade is run.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-startup-job
      labels:
        app.kubernetes.io/name: {{ .Values.labels.name }}
        app.kubernetes.io/instance: {{ .Values.labels.instance }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: startup-job
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c", "scripts/startup.sh"]
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
          envFrom:
            - secretRef:
                name: {{ include "technical-deck.fullname" . }}-secret
  backoffLimit: 1