# charts/technical-deck/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technical-deck
  namespace: copilotgtm
  labels:
    app.kubernetes.io/name: technical-deck
    app.kubernetes.io/instance: technical-deck
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technical-deck
      app.kubernetes.io/instance: technical-deck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technical-deck
        app.kubernetes.io/instance: technical-deck
    spec:
      serviceAccountName: technical-deck
      containers:
        - name: technical-deck
          image: "copilotgtmacrdev.azurecr.io/technical-deck-app:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "development"
          resources:
            requests:
              memory: "512Mi"
              cpu: "256m"
            limits:
              memory: "1024Mi"
              cpu: "512m"
