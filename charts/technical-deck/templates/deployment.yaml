apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "technical-deck.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "technical-deck.name" . }}
  template:
    metadata:
      labels:
        app: technical-deck
        app.kubernetes.io/instance: technical-deck
        app.kubernetes.io/name: technical-deck
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
          {{- if .Values.env }}
          {{- range $key, $value := .Values.env }}
            {{- if ne $key "ENVIRONMENT" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
