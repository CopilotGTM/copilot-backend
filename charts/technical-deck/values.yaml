replicaCount: 1

image:
  repository: copilotgtmacrdev.azurecr.io/technical-deck-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 80
  type: ClusterIP

env:
  - name: ENVIRONMENT
    value: "development"

serviceAccount:
  create: true
  name: technical-deck
  automount: true
  annotations: {}

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: devapi.copilotgtm.com
      paths:
        - path: /
          pathType: Prefix
  annotations:
    # kubernetes.io/ingress.class: "nginx"  # This is legacy, using spec.ingressClassName instead
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt" # Tells cert-manager to get a cert
    # alb.ingress.kubernetes.io/scheme: internet-facing  # Uncomment for AWS ALB, making it public
  tls:
    - hosts:
        - devapi.copilotgtm.com
      secretName: devapi-tls

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

resources:
  requests:
    memory: "512Mi"
    cpu: "256m"
  limits:
    memory: "1024Mi"
    cpu: "512m"

# Default empty secrets object to satisfy the linter.
# These values are overridden by the pipeline at runtime.
secrets: {}
