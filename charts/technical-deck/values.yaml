chartLabel: technical-deck-0.1.0
name: technical-deck
namespace: copilotgtm
labels:
  name: technical-deck
  instance: technical-deck
containerName: technical-deck
environment: development
replicaCount: 1

image:
  repository: "copilotgtmacrdev.azurecr.io/technical-deck-app"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: technical-deck
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt"
  hosts:
    - host: "devapi.copilotgtm.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - "devapi.copilotgtm.com"
      secretName: "devapi-tls"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 512m
    memory: 1024Mi
  requests:
    cpu: 256m
    memory: 512Mi

secrets: {}

serviceAccount:
  create: true
  name: "technical-deck"
