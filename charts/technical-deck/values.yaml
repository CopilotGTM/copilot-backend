replicaCount: 1

image:
  repository: copilottechnicaldeck.azurecr.io/technical-deck-app
  tag: "latest"

service:
  port: 80
  type: ClusterIP

# Non-sensitive env vars (from .env.development or Azure Pipeline var group - injected into ConfigMap)
envNonSecret:
  ENVIRONMENT: development
  # EXAMPLE_VAR: some-value
  # Add more non-secret variables here as needed. Values can be overridden via Azure Pipeline variable group.

# Sensitive env vars (to be provided via Azure DevOps pipeline secrets - injected into Secret)
envSecret:
  # DATABASE_PASSWORD: ""
  # API_KEY: ""
  # Only set in pipeline (never commit actual secrets here)

serviceAccount:
  create: true
  name: ""
  automount: true

ingress:
  enabled: true
  className: nginx         # Use "nginx" for NGINX Ingress, "alb" for AWS ALB, etc.
  hosts:
    - host: api.copilotgtm.com  # Replace with your public DNS or AWS ALB DNS
      paths:
        - path: /
          pathType: Prefix
  annotations:
    kubernetes.io/ingress.class: "nginx"  # For NGINX. Use "alb" for AWS ALB, etc.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "{{ .Release.Name }}-{{ .Release.Name }}"
    # alb.ingress.kubernetes.io/scheme: internet-facing  # Uncomment for AWS ALB, making it public
  tls:
    - hosts:
        - api.copilotgtm.com
      secretName: api-copilotgtm-com-tls  # This Secret must be created or managed by cert-manager

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

resources:
  requests:
    memory: "1024Mi"
    cpu: "500m"
  limits:
    memory: "2048Mi"
    cpu: "2000m"