apiVersion: v1
kind: Secret
metadata:
  name: {{ include "copilot-backend.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "copilot-backend.name" . }}
    helm.sh/chart: {{ include "copilot-backend.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
{{- with .Values.secrets }}
{{- range $key, $value := . }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
{{- end }}
{{- end }}