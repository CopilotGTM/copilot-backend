                - script: |
                    kubectl get pods -n copilotgtm
                    kubectl get deployments -n copilotgtm
                    kubectl get cronjobs -n copilotgtm
                    kubectl get scaledobjects -n copilotgtm
                  displayName: List AKS Deployments/Pods

                - script: |
                    set -euo pipefail

                    restart_if_present() {
                      local deployment_name="$1"

                      if kubectl get deployment "$deployment_name" -n copilotgtm >/dev/null 2>&1; then
                        kubectl rollout restart deployment "$deployment_name" -n copilotgtm
                        kubectl rollout status deployment "$deployment_name" -n copilotgtm --timeout=300s
                      else
                        echo "Skipping missing deployment: $deployment_name"
                      fi
                    }

                    echo "Restarting worker deployments to ensure latest values are applied..."
                    restart_if_present copilot-backend-knowledge-extract-worker
                    restart_if_present copilot-backend-knowledge-upload-worker
                    restart_if_present copilot-backend-chat-worker
                    restart_if_present copilot-backend-chat-beat
                    restart_if_present copilot-backend-organization-worker
                    restart_if_present copilot-backend-integrations-worker
                    restart_if_present copilot-backend-deal-worker
                  displayName: Force restart workers

                - task: Bash@3
                  displayName: Rollback on Helm Deploy Failure
                  condition: failed()
                  inputs:
                    targetType: 'inline'
                    script: |
                      export KUBECONFIG=$(KUBECONFIG_FILE)
                      if helm status $(HELM_RELEASE_NAME); then
                        REVISION=$(helm history $(HELM_RELEASE_NAME) | awk 'NR==2{print $1}')
                        if [ ! -z "$REVISION" ]; then
                          echo "Rolling back to previous successful release (revision $REVISION)..."
                          helm rollback $(HELM_RELEASE_NAME) $REVISION
                        fi
                      fi
