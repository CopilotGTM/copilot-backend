                    WORKLOAD_IDENTITY_API_TENANT_ID: $(WORKLOAD_IDENTITY_API_TENANT_ID)
                    WORKLOAD_IDENTITY_WORKERS_TENANT_ID: $(WORKLOAD_IDENTITY_WORKERS_TENANT_ID)

                - script: |
                    kubectl get pods -n copilotgtm
                    kubectl get deployments -n copilotgtm
                    kubectl get cronjobs -n copilotgtm
                    kubectl get scaledobjects -n copilotgtm
                  displayName: List AKS Deployments/Pods

                - script: |
                    set -euo pipefail

                    wait_if_present() {
                      local deployment_name="$1"

                      if kubectl get deployment "$deployment_name" -n copilotgtm >/dev/null 2>&1; then
                        kubectl rollout status deployment "$deployment_name" -n copilotgtm --timeout=300s
                      else
                        echo "Skipping missing deployment: $deployment_name"
                      fi
                    }

                    echo "Waiting for API and worker deployments updated by Helm..."
                    wait_if_present copilot-backend
                    wait_if_present copilot-backend-knowledge-extract-worker
                    wait_if_present copilot-backend-knowledge-upload-worker
                    wait_if_present copilot-backend-chat-worker
                    wait_if_present copilot-backend-chat-beat
                    wait_if_present copilot-backend-organization-worker
                    wait_if_present copilot-backend-integrations-worker
                    wait_if_present copilot-backend-deal-worker
                  displayName: Wait for API and worker rollouts

                - task: Bash@3
                  displayName: Rollback on Helm Deploy Failure
                  condition: failed()
                  inputs:
                    targetType: 'inline'
                    script: |
                      if helm status $(HELM_RELEASE_NAME) -n copilotgtm; then
                        echo "Rolling back to previous release revision..."
                        helm rollback $(HELM_RELEASE_NAME) -n copilotgtm --wait --timeout 20m
                      fi
