# ============================================================================
# Azure DevOps Pipeline - Backend PROD Environment
# ============================================================================
# This pipeline handles PROD deployments only.
# Triggers on: release/backend/* branches
# Deploys to: Prod AKS cluster via Helm (with approval gate)
# ============================================================================

trigger:
  branches:
    include:
      - release/backend/*

pr: none  # No PR triggers for prod pipeline

variables:
  # Use prod-specific variable group
  - group: app-secrets-prod
  - name: ENVIRONMENT
    value: 'prod'
  - name: PROD_DEPLOY_AGENT_POOL
    value: 'copilot-devops-prod-deploy'

  # Helm/Chart configuration
  - name: CHART_PATH
    value: ./charts/application
  - name: PYTHON_VERSION
    value: '3.11'

  # Observability Stack (Loki + Promtail + Grafana)
  # DISABLED in prod - enable only for targeted debugging sessions
  - name: ENABLE_OBSERVABILITY
    value: 'false'

  # Image repositories
  - name: API_IMAGE_REPOSITORY
    value: 'copilot-backend-api'
  - name: KNOWLEDGE_IMAGE_REPOSITORY
    value: 'copilot-backend-knowledge-worker'
  - name: LIGHT_IMAGE_REPOSITORY
    value: 'copilot-backend-light-worker'
  - name: INTEGRATIONS_IMAGE_REPOSITORY
    value: 'copilot-backend-integrations-worker'

  # Kubeconfig for prod
  - name: PROD_KUBECONFIG
    value: 'kubeconfig-prod.yaml'

stages:

  # ==========================================================================
  # Stage 1: Code Quality & Testing
  # ==========================================================================
  - stage: QualityCheck
    displayName: Code Quality & Tests
    condition: succeeded()
    jobs:
      - job: QualityAndSecurity
        displayName: Quality Checks & Security Scan
        pool:
          name: $(PROD_DEPLOY_AGENT_POOL)
        steps:
          - checkout: self

          # ===================================================================
          # Dockerfile Linting with Hadolint (CIS Docker Benchmark compliance)
          # ===================================================================
          - script: |
              echo "##[section]🐳 Linting Dockerfiles with Hadolint..."

              # Install Hadolint if not present
              if ! command -v hadolint &> /dev/null; then
                echo "Installing Hadolint..."
                wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
                chmod +x /usr/local/bin/hadolint
              fi

              echo ""
              echo "Linting Dockerfile (production)..."
              hadolint Dockerfile --format tty || HADOLINT_FAILED=1

              echo ""
              echo "Linting Dockerfile.local (development)..."
              hadolint Dockerfile.local --format tty || HADOLINT_FAILED=1

              if [ "$HADOLINT_FAILED" = "1" ]; then
                echo "##[warning]⚠️ Hadolint found issues - review above warnings"
              else
                echo "##[section]✅ Dockerfile linting passed!"
              fi
            displayName: '🐳 Dockerfile Lint (Hadolint)'
            continueOnError: true

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Install UV'

          - script: |
              uv python install $(PYTHON_VERSION)
            displayName: 'Install Python $(PYTHON_VERSION)'

          - script: |
              mkdir -p security-reports secrets-scan-reports sca-reports
            displayName: 'Prepare CASA Security Report Directories'

          - script: |
              uv sync --frozen --no-install-project --no-dev --only-group quality
              source .venv/bin/activate
            displayName: 'Install Quality Tools Only (Ruff, Bandit, MyPy)'

          - script: |
              source .venv/bin/activate
              ruff format --check src/ tests/
            displayName: '✨ Code Formatting Check (Ruff Format)'

          - script: |
              source .venv/bin/activate
              ruff check src/ tests/
            displayName: '🔍 Linting Check (Ruff)'

          - script: |
              source .venv/bin/activate
              mypy src/ || true
            displayName: '📝 Type Checking (MyPy) - Advisory Only'

          - script: |
              set -euo pipefail
              source .venv/bin/activate
              mkdir -p security-reports
              bandit -c pyproject.toml -r src/ -f json -o security-reports/bandit-report.json || true
              bandit -c pyproject.toml -r src/ -f txt -o security-reports/bandit-report.txt
              cat security-reports/bandit-report.txt
            displayName: '🔒 Security Scan (Bandit)'

          - script: |
              set -euo pipefail
              mkdir -p secrets-scan-reports

              echo "##[section]🔐 Running detect-secrets baseline gate..."
              uv run --with detect-secrets detect-secrets scan \
                --exclude-files '(^|[\\/])\.secrets\.baseline$|^infra[\\/]security[\\/]casa[\\/]evidence[\\/]' \
                > secrets-scan-reports/detect-secrets-current.json

              uv run python scripts/security/check_detect_secrets_baseline.py \
                --baseline .secrets.baseline \
                --current-json secrets-scan-reports/detect-secrets-current.json \
                --output secrets-scan-reports/detect-secrets-baseline-check.txt || {
                  cat secrets-scan-reports/detect-secrets-baseline-check.txt
                  exit 1
                }

              cat secrets-scan-reports/detect-secrets-baseline-check.txt
            displayName: '🔐 Secrets Baseline Gate (detect-secrets)'

          - script: |
              set -euo pipefail
              mkdir -p sca-reports

              echo "##[section]🔎 Running Python dependency vulnerability scan..."
              uv export --format requirements.txt --locked --no-dev --no-emit-project --no-header \
                --output-file sca-reports/python-requirements.txt

              uv run --with pip-audit pip-audit \
                --requirement sca-reports/python-requirements.txt \
                --progress-spinner off \
                --format columns \
                --output sca-reports/pip-audit-report.txt

              cat sca-reports/pip-audit-report.txt
            displayName: '🔎 Python Dependency SCA (pip-audit)'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Security Report'
            inputs:
              targetPath: 'security-reports'
              artifact: 'security-report'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Secrets Scan Reports'
            inputs:
              targetPath: 'secrets-scan-reports'
              artifact: 'secrets-scan-reports'
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Python SCA Reports'
            inputs:
              targetPath: 'sca-reports'
              artifact: 'python-sca-reports'
            condition: succeededOrFailed()

  # ==========================================================================
  # Stage 2: Build & Push Docker Image
  # ==========================================================================
  - stage: BuildAndPush
    displayName: Build & Push Docker Image to ACR
    dependsOn:
      - QualityCheck
    condition: succeeded()
    jobs:
      - job: dockerBuildPush
        displayName: Build and Push to ACR
        pool:
          name: $(PROD_DEPLOY_AGENT_POOL)
        steps:
          - checkout: self

          - script: |
              echo "##[section]📊 Checking disk space before cleanup..."
              df -h
              DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
              echo "Current disk usage: ${DISK_USAGE}%"

              echo ""
              echo "##[section]🧹 Cleaning up Docker resources..."
              docker container prune -f || true
              docker image prune -a -f || true
              docker volume prune -f || true
              docker builder prune -a -f || true

              echo ""
              echo "##[section]✅ Disk space after cleanup:"
              df -h
              DISK_USAGE_AFTER=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
              echo "Disk usage after cleanup: ${DISK_USAGE_AFTER}%"

              if [ "$DISK_USAGE_AFTER" -gt 90 ]; then
                echo "##[error]❌ Critical: Disk usage is ${DISK_USAGE_AFTER}% - aborting build"
                exit 1
              elif [ "$DISK_USAGE_AFTER" -gt 80 ]; then
                echo "##[warning]⚠️ Warning: Disk usage is ${DISK_USAGE_AFTER}% - consider cleaning up agent"
              else
                echo "##[section]✅ Disk space is healthy (${DISK_USAGE_AFTER}% used)"
              fi
            displayName: 'Clean Up Disk Space & Check'

          - script: |
              echo "##[group]Verifying Environment Configuration"
              echo "Environment: $(ENVIRONMENT)"
              echo "ACR Login Server: $(ACR_LOGIN_SERVER)"
              echo "Helm Release Name: $(HELM_RELEASE_NAME)"
              echo "Build ID: $(Build.BuildId)"
              echo "##[endgroup]"
            displayName: 'Echo Environment Variables'

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              containerRegistry: '$(ACR_SERVICE_CONNECTION)'
              command: 'login'

          # ===================================================================
          # Pull cache images - only pull target-specific images (not full)
          # Each target has its own dependency set, so cross-cache is not useful
          # ===================================================================
          - script: |
              echo "##[section]🚀 Pulling cache images from ACR for faster builds..."
              echo "Note: Only pulling target-specific images for optimal caching"
              {
                docker pull $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):latest || echo "⚠️ No latest api image found"
              } &
              {
                docker pull $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):latest || echo "⚠️ No latest knowledge image found"
              } &
              {
                docker pull $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):latest || echo "⚠️ No latest light-worker image found"
              } &
              {
                docker pull $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):latest || echo "⚠️ No latest integrations image found"
              } &
              wait
              echo "##[section]✅ Cache pull complete"
            displayName: 'Pull Cache Images from ACR'
            env:
              DOCKER_BUILDKIT: '1'
            continueOnError: 'true'

          # ===================================================================
          # Build API Image - FastAPI application with aiohttp for async Key Vault
          # Target: api (installs 'api' extra from pyproject.toml)
          # Note: Using script instead of Docker@2 buildAndPush because
          #       buildAndPush ignores the 'arguments' input (no cache support)
          # ===================================================================
          - script: |
              echo "##[section]🔨 Building API Image with cache..."
              docker build \
                --target api \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                --cache-from=$(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):latest \
                -t $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):$(Build.BuildId) \
                -t $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):latest \
                -f Dockerfile \
                .

              echo "##[section]📤 Pushing API Image..."
              docker push $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):$(Build.BuildId)
              docker push $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):latest
              echo "##[section]✅ API Image complete"
            displayName: 'Build & Push API Image (target: api)'
            env:
              DOCKER_BUILDKIT: 1
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              API_IMAGE_REPOSITORY: $(API_IMAGE_REPOSITORY)

          # ===================================================================
          # Build Knowledge Worker - Heavy ML/Document processing
          # Target: knowledge-worker (installs 'knowledge' extra)
          # ===================================================================
          - script: |
              echo "##[section]🔨 Building Knowledge Worker Image with cache..."
              docker build \
                --target knowledge-worker \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                --cache-from=$(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):latest \
                -t $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):$(Build.BuildId) \
                -t $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):latest \
                -f Dockerfile \
                .

              echo "##[section]📤 Pushing Knowledge Worker Image..."
              docker push $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):$(Build.BuildId)
              docker push $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):latest
              echo "##[section]✅ Knowledge Worker Image complete"
            displayName: 'Build & Push Knowledge Worker Image (target: knowledge-worker)'
            env:
              DOCKER_BUILDKIT: 1
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              KNOWLEDGE_IMAGE_REPOSITORY: $(KNOWLEDGE_IMAGE_REPOSITORY)

          # ===================================================================
          # Build Light Worker - Chat, Deal, Organization workers
          # Target: light-worker (installs 'workers-light' extra)
          # ===================================================================
          - script: |
              echo "##[section]🔨 Building Light Worker Image with cache..."
              docker build \
                --target light-worker \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                --cache-from=$(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):latest \
                -t $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):$(Build.BuildId) \
                -t $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):latest \
                -f Dockerfile \
                .

              echo "##[section]📤 Pushing Light Worker Image..."
              docker push $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):$(Build.BuildId)
              docker push $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):latest
              echo "##[section]✅ Light Worker Image complete"
            displayName: 'Build & Push Light Worker Image (target: light-worker)'
            env:
              DOCKER_BUILDKIT: 1
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              LIGHT_IMAGE_REPOSITORY: $(LIGHT_IMAGE_REPOSITORY)

          # ===================================================================
          # Build Integrations Worker - CRM/Third-party sync
          # Target: integrations-worker (installs 'integrations' extra)
          # ===================================================================
          - script: |
              echo "##[section]🔨 Building Integrations Worker Image with cache..."
              docker build \
                --target integrations-worker \
                --build-arg BUILDKIT_INLINE_CACHE=1 \
                --cache-from=$(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):latest \
                -t $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):$(Build.BuildId) \
                -t $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):latest \
                -f Dockerfile \
                .

              echo "##[section]📤 Pushing Integrations Worker Image..."
              docker push $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):$(Build.BuildId)
              docker push $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):latest
              echo "##[section]✅ Integrations Worker Image complete"
            displayName: 'Build & Push Integrations Worker Image (target: integrations-worker)'
            env:
              DOCKER_BUILDKIT: 1
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              INTEGRATIONS_IMAGE_REPOSITORY: $(INTEGRATIONS_IMAGE_REPOSITORY)

          - script: |
              echo "##[section]✅ Build Complete!"
              echo "📦 API: $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):$(Build.BuildId)"
              echo "📦 Knowledge Worker: $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):$(Build.BuildId)"
              echo "📦 Light Worker: $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):$(Build.BuildId)"
              echo "📦 Integrations Worker: $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):$(Build.BuildId)"
              echo ""
              echo "Note: Using separated images - each with its own optimized dependencies"
            displayName: 'Build Summary'

          # ===================================================================
          # Security: Vulnerability Scanning with Trivy
          # Scans images for CRITICAL and HIGH vulnerabilities
          # ===================================================================
          - script: |
              mkdir -p trivy-reports
            displayName: 'Prepare Trivy Report Directory'

          - script: |
              echo "##[section]🔒 Installing Trivy vulnerability scanner..."

              # Install Trivy if not present
              if ! command -v trivy &> /dev/null; then
                mkdir -p "$(Agent.TempDirectory)/trivy-bin"
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$(Agent.TempDirectory)/trivy-bin" v0.49.1
                export PATH="$(Agent.TempDirectory)/trivy-bin:$PATH"
              fi

              trivy --version
              echo ""
            displayName: 'Install Trivy Scanner'

          - script: |
              echo "##[section]🔍 Scanning API image for vulnerabilities..."
              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                --format table \
                --output trivy-reports/trivy-api-report.txt \
                $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):$(Build.BuildId)

              cat trivy-reports/trivy-api-report.txt
              echo ""
              echo "##[section]✅ API image scan complete"
            displayName: '🔍 Trivy Scan: API Image'
            env:
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              API_IMAGE_REPOSITORY: $(API_IMAGE_REPOSITORY)

          - script: |
              echo "##[section]🔍 Scanning Light Worker image for vulnerabilities..."
              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                --format table \
                --output trivy-reports/trivy-light-worker-report.txt \
                $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):$(Build.BuildId)

              cat trivy-reports/trivy-light-worker-report.txt
              echo ""
              echo "##[section]✅ Light Worker image scan complete"
            displayName: '🔍 Trivy Scan: Light Worker'
            env:
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              LIGHT_IMAGE_REPOSITORY: $(LIGHT_IMAGE_REPOSITORY)

          - script: |
              echo "##[section]🔍 Scanning Integrations Worker image for vulnerabilities..."
              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                --format table \
                --output trivy-reports/trivy-integrations-worker-report.txt \
                $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):$(Build.BuildId)

              cat trivy-reports/trivy-integrations-worker-report.txt
              echo ""
              echo "##[section]✅ Integrations Worker image scan complete"
            displayName: '🔍 Trivy Scan: Integrations Worker'
            env:
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              INTEGRATIONS_IMAGE_REPOSITORY: $(INTEGRATIONS_IMAGE_REPOSITORY)

          - script: |
              echo "##[section]🔍 Scanning Knowledge Worker image for vulnerabilities..."
              echo "Note: This image is larger and may take longer to scan"
              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                --format table \
                --output trivy-reports/trivy-knowledge-worker-report.txt \
                $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):$(Build.BuildId)

              cat trivy-reports/trivy-knowledge-worker-report.txt
              echo ""
              echo "##[section]✅ Knowledge Worker image scan complete"
            displayName: '🔍 Trivy Scan: Knowledge Worker'
            env:
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              KNOWLEDGE_IMAGE_REPOSITORY: $(KNOWLEDGE_IMAGE_REPOSITORY)

          - script: |
              echo "##[section]📊 Generating vulnerability report (JSON)..."

              # Generate JSON reports for all images
              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --no-progress \
                --format json \
                --output trivy-reports/trivy-api-report.json \
                $(ACR_LOGIN_SERVER)/$(API_IMAGE_REPOSITORY):$(Build.BuildId) || true

              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --no-progress \
                --format json \
                --output trivy-reports/trivy-light-worker-report.json \
                $(ACR_LOGIN_SERVER)/$(LIGHT_IMAGE_REPOSITORY):$(Build.BuildId) || true

              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --no-progress \
                --format json \
                --output trivy-reports/trivy-integrations-worker-report.json \
                $(ACR_LOGIN_SERVER)/$(INTEGRATIONS_IMAGE_REPOSITORY):$(Build.BuildId) || true

              trivy image \
                --severity CRITICAL,HIGH \
                --ignore-unfixed \
                --no-progress \
                --format json \
                --output trivy-reports/trivy-knowledge-worker-report.json \
                $(ACR_LOGIN_SERVER)/$(KNOWLEDGE_IMAGE_REPOSITORY):$(Build.BuildId) || true

              echo "##[section]✅ Vulnerability reports generated"
            displayName: 'Generate Trivy Reports (JSON)'
            env:
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              API_IMAGE_REPOSITORY: $(API_IMAGE_REPOSITORY)
              LIGHT_IMAGE_REPOSITORY: $(LIGHT_IMAGE_REPOSITORY)
              INTEGRATIONS_IMAGE_REPOSITORY: $(INTEGRATIONS_IMAGE_REPOSITORY)
              KNOWLEDGE_IMAGE_REPOSITORY: $(KNOWLEDGE_IMAGE_REPOSITORY)
            continueOnError: true

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Trivy Vulnerability Reports'
            inputs:
              targetPath: 'trivy-reports'
              artifact: 'trivy-reports'
            condition: succeededOrFailed()

          # ===================================================================
          # ACR Cleanup - Retain rollback tags and remove old untagged manifests
          # ===================================================================
          - script: |
              set -euo pipefail
              PYTHON_BIN="$(command -v python3 || command -v python)"
              ACR_NAME="${ACR_LOGIN_SERVER%%.*}"

              if ! "$PYTHON_BIN" .azure-pipelines/scripts/acr_cleanup.py \
                  --registry "$ACR_NAME" \
                  --repository "$API_IMAGE_REPOSITORY" \
                  --repository "$KNOWLEDGE_IMAGE_REPOSITORY" \
                  --repository "$LIGHT_IMAGE_REPOSITORY" \
                  --repository "$INTEGRATIONS_IMAGE_REPOSITORY" \
                  --keep-tags 50 \
                  --untagged-days 30 \
                  --protect-tag latest \
                  --protect-tag "$BUILD_BUILDID"; then
                echo "##vso[task.logissue type=warning]ACR cleanup failed; continuing deployment."
              fi
            displayName: 'Cleanup ACR Images (Prod Retention)'
            env:
              ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
              API_IMAGE_REPOSITORY: $(API_IMAGE_REPOSITORY)
              KNOWLEDGE_IMAGE_REPOSITORY: $(KNOWLEDGE_IMAGE_REPOSITORY)
              LIGHT_IMAGE_REPOSITORY: $(LIGHT_IMAGE_REPOSITORY)
              INTEGRATIONS_IMAGE_REPOSITORY: $(INTEGRATIONS_IMAGE_REPOSITORY)
              BUILD_BUILDID: $(Build.BuildId)
            continueOnError: true

  # ==========================================================================
  # Stage 3: Deploy to Prod AKS (Requires Approval)
  # ==========================================================================
  - stage: Deploy
    displayName: Deploy to Prod AKS
    dependsOn:
      - BuildAndPush
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: HelmDeploy
        displayName: Deploy to Prod AKS
        environment: 'terraform-prod'  # Uses approval gate configured in Azure DevOps
        pool:
          name: $(PROD_DEPLOY_AGENT_POOL)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Kubernetes@1
                  displayName: 'Login to Kubernetes cluster'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: $(PROD_KUBECONFIG)
                    command: 'login'

                - script: |
                    kubectl delete job copilot-backend-startup -n copilotgtm --ignore-not-found
                    kubectl delete pods -n copilotgtm -l job-name=copilot-backend-startup --ignore-not-found
                    sleep 10
                  displayName: 'Clean up previous startup Job and Pods'

                - script: |
                    EXTRA_HELM_ARGS=""
                    if [ "$(ENABLE_OBSERVABILITY)" = "true" ]; then
                      EXTRA_HELM_ARGS="$EXTRA_HELM_ARGS --set loki.enabled=true --set promtail.enabled=true --set grafana.enabled=true"
                    fi

                    helm upgrade --install "$HELM_RELEASE_NAME" "$CHART_PATH" \
                      -f "$CHART_PATH/values-prod.yaml" \
                      --namespace copilotgtm \
                      --timeout 20m \
                      --set api.workloadIdentity.clientId="$(WORKLOAD_IDENTITY_BACKEND_CLIENT_ID)" \
                      --set api.workloadIdentity.tenantId="$(WORKLOAD_IDENTITY_API_TENANT_ID)" \
                      --set global.redis.host="$REDIS_HOST" \
                      --set global.redis.port="$REDIS_PORT" \
                      --set global.redis.enableTLS=true \
                      --set global.redis.usePassword=true \
                      $EXTRA_HELM_ARGS \
                      --set 'api.ingress.hosts[0].host=api.copilotgtm.com' \
                      --set 'api.ingress.hosts[0].paths[0].path=/' \
                      --set 'api.ingress.hosts[0].paths[0].pathType=Prefix' \
                      --set 'api.ingress.tls[0].hosts[0]=api.copilotgtm.com' \
                      --set 'api.ingress.tls[0].secretName=api-tls' \
                      --set api.environment=production \
                      --set api.image.repository="$ACR_LOGIN_SERVER/$(API_IMAGE_REPOSITORY)" \
                      --set api.image.tag="$BUILD_BUILDID" \
                      --set knowledge-extract-worker.image.repository="$ACR_LOGIN_SERVER/$(KNOWLEDGE_IMAGE_REPOSITORY)" \
                      --set knowledge-extract-worker.image.tag="$BUILD_BUILDID" \
                      --set knowledge-extract-worker.autoscaling.enabled=true \
                      --set knowledge-extract-worker.gpu.enabled=true \
