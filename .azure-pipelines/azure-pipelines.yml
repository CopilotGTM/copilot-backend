# ============================================================================
# Azure DevOps Production Pipeline with UV
# ============================================================================
# This pipeline:
# 1. Runs code quality checks (linting, formatting, type checking)
# 2. Runs security scans
# 3. Executes tests with coverage
# 4. Builds and pushes optimized Docker images using UV
# 5. Deploys to AKS using Helm
# ============================================================================

trigger:
  branches:
    include:
      - main
      - dev
      - uat

pr:
  branches:
    include:
      - main
      - dev
      - uat

variables:
  - name: CHART_PATH
    value: ./charts/application
  - name: KUBECONFIG_FILE
    value: $(Pipeline.Workspace)/kubeconfig.yaml
  - name: PYTHON_VERSION
    value: '3.11'

stages:
  # ==========================================================================
  # Stage 1: Code Quality & Testing
  # ==========================================================================
  - stage: QualityCheck
    displayName: Code Quality & Tests
    jobs:
      - job: CodeQuality
        displayName: Lint, Format, Type Check
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install UV'

          - script: |
              uv python install $(PYTHON_VERSION)
            displayName: 'Install Python $(PYTHON_VERSION)'

          - script: |
              uv sync --frozen --extra dev
            displayName: 'Install Dependencies with UV (including dev tools)'

          - script: |
              uv run black --check src/ tests/
            displayName: 'Code Formatting Check (Black)'

          - script: |
              uv run ruff check src/ tests/
            displayName: 'Linting (Ruff)'

          - script: |
              uv run mypy src/ || true
            displayName: 'Type Checking (MyPy) - Advisory Only'

      - job: Tests
        displayName: Run Tests with Coverage
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install UV'

          - script: |
              uv python install $(PYTHON_VERSION)
            displayName: 'Install Python $(PYTHON_VERSION)'

          - script: |
              uv sync --frozen --extra test
            displayName: 'Install Dependencies with UV (including test dependencies)'

          - script: |
              uv run pytest tests/ -v --junitxml=test-results.xml
            displayName: 'Run Tests'

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results.xml'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

      - job: SecurityScan
        displayName: Security Scanning
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install UV'

          - script: |
              uv python install $(PYTHON_VERSION)
              uv sync --frozen --group dev
            displayName: 'Setup Environment (with dev dependencies for bandit)'

          - script: |
              uv run bandit -r src/ -f json -o bandit-report.json || true
            displayName: 'Run Bandit Security Scan'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Security Report'
            inputs:
              targetPath: 'bandit-report.json'
              artifact: 'security-report'
            condition: succeededOrFailed()

  # ==========================================================================
  # Stage 2: Build & Push Docker Image
  # ==========================================================================
  - stage: BuildAndPush
    displayName: Build & Push Docker Image to ACR
    dependsOn: QualityCheck
    condition: succeeded()
    jobs:
      - job: dockerBuildPush
        displayName: Build and Push to ACR
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              echo "##[group]Verifying Environment Configuration"
              echo "Deployment Environment: $(DEPLOY_ENVIRONMENT)"
              echo "ACR Login Server: $(ACR_LOGIN_SERVER)"
              echo "Helm Release Name: $(HELM_RELEASE_NAME)"
              echo "ACR Service Connection: $(ACR_SERVICE_CONNECTION)"
              echo "Build ID: $(Build.BuildId)"
              echo "##[endgroup]"
            displayName: 'Echo Environment Variables'

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              containerRegistry: '$(ACR_SERVICE_CONNECTION)'
              command: 'login'

          - script: |
              echo "##[section]🚀 Pulling cache images from ACR for faster builds..."
              docker pull $(ACR_LOGIN_SERVER)/copilot-backend:latest || echo "⚠️ No latest image found, building from scratch"
              echo "##[section]✅ Cache pull complete"
            displayName: 'Pull Cache Images from ACR'
            env:
              DOCKER_BUILDKIT: '1'
            continueOnError: 'true'

          - task: Docker@2
            displayName: 'Build Docker Image with Cache'
            inputs:
              containerRegistry: '$(ACR_SERVICE_CONNECTION)'
              repository: 'copilot-backend'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              tags: |
                $(Build.BuildId)
                latest
              arguments: |
                --build-arg BUILDKIT_INLINE_CACHE=1
                --cache-from=$(ACR_LOGIN_SERVER)/copilot-backend:latest
            env:
              DOCKER_BUILDKIT: 1

          - script: |
              echo "##[section]✅ Build Complete!"
              echo "📦 Image: $(ACR_LOGIN_SERVER)/copilot-backend:$(Build.BuildId)"
              echo "📦 Latest: $(ACR_LOGIN_SERVER)/copilot-backend:latest"
              echo "⚡ Next build will reuse cached layers for faster builds"
            displayName: 'Build Summary'

  - stage: Deploy
    displayName: Helm Deploy/Upgrade to AKS
    dependsOn: BuildAndPush
    jobs:
      - deployment: HelmDeploy
        displayName: Deploy to AKS / Rollback on Failure
        environment: '$(DEPLOY_ENVIRONMENT)'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: Kubernetes@1
                  displayName: 'Login to Kubernetes cluster'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'kubeconfig.yaml'
                    command: 'login'

                - script: |
                    ls -R
                  displayName: 'List files in workspace'

                - script: |
                    # Delete existing startup job and pods to avoid immutable field patch errors
                    kubectl delete job copilot-backend-startup -n copilotgtm --ignore-not-found
                    kubectl delete pods -n copilotgtm -l job-name=copilot-backend-startup --ignore-not-found
                    # Wait a moment for cleanup to complete
                    sleep 10
                  displayName: 'Clean up previous startup Job and Pods'

                - script: |
                    helm upgrade --install "$HELM_RELEASE_NAME" "$CHART_PATH" \
                      --namespace copilotgtm \
                      --set api.workloadIdentity.clientId="$(WORKLOAD_IDENTITY_BACKEND_CLIENT_ID)" \
                      --set api.workloadIdentity.tenantId="$(WORKLOAD_IDENTITY_API_TENANT_ID)" \
                      --set global.redis.host="$REDIS_HOST" \
                      --set global.redis.port="$REDIS_PORT" \
                      --set global.redis.enableTLS=true \
                      --set global.redis.usePassword=true \
                      --set api.image.repository="$ACR_LOGIN_SERVER/copilot-backend" \
                      --set api.image.tag="$BUILD_BUILDID" \
                      --set knowledge-extract-worker.image.repository="$ACR_LOGIN_SERVER/copilot-backend" \
                      --set knowledge-extract-worker.image.tag="$BUILD_BUILDID" \
                      --set knowledge-extract-worker.autoscaling.enabled=true \
                      --set knowledge-extract-worker.gpu.enabled=true \
                      --set knowledge-upload-worker.image.repository="$ACR_LOGIN_SERVER/copilot-backend" \
                      --set knowledge-upload-worker.image.tag="$BUILD_BUILDID" \
                      --set knowledge-upload-worker.autoscaling.enabled=true \
                      --set chat-worker.image.repository="$ACR_LOGIN_SERVER/copilot-backend" \
                      --set chat-worker.image.tag="$BUILD_BUILDID" \
                      --set organization-worker.image.repository="$ACR_LOGIN_SERVER/copilot-backend" \
                      --set organization-worker.image.tag="$BUILD_BUILDID" \
                      --set api.secrets.DATABASE_HOST="$(DATABASE_HOST)" \
                      --set api.secrets.DATABASE_USER="$(DATABASE_USER)" \
                      --set api.secrets.DATABASE_PORT="$(DATABASE_PORT)" \
                      --set api.secrets.DATABASE_NAME="$(DATABASE_NAME)" \
                      --set api.secrets.DATABASE_PASSWORD="$(DATABASE_PASSWORD)" \
                      --set api.secrets.REDIS_HOST="$(REDIS_HOST)" \
                      --set api.secrets.REDIS_PORT="$(REDIS_PORT)" \
                      --set api.secrets.REDIS_PASSWORD="$(REDIS_PASSWORD)" \
                      --set api.secrets.REDIS_SSL_CERT_REQS=CERT_NONE \
                      --set api.secrets.AZURE_OPENAI_API_KEY="$(AZURE_OPENAI_API_KEY)" \
                      --set api.secrets.AZURE_OPENAI_ENDPOINT="$(AZURE_OPENAI_ENDPOINT)" \
                      --set api.secrets.AZURE_EMBEDDER_OPENAI_API_KEY="$(AZURE_EMBEDDER_OPENAI_API_KEY)" \
                      --set api.secrets.AZURE_EMBEDDER_OPENAI_ENDPOINT="$(AZURE_EMBEDDER_OPENAI_ENDPOINT)" \
                      --set api.secrets.AZURE_EMBEDDER_DEPLOYMENT="$(AZURE_EMBEDDER_DEPLOYMENT)" \
                      --set api.secrets.CLOUD_PROVIDER="$(CLOUD_PROVIDER)" \
                      --set api.secrets.APPLICATION_STORAGE_NAME="$(APPLICATION_STORAGE_NAME)" \
                      --set api.secrets.ORGANISATION_STORAGE_NAME="$(ORGANISATION_STORAGE_NAME)" \
                      --set api.secrets.APPLICATION_REGION="$(APPLICATION_REGION)" \
                      --set api.secrets.DATABASE_SSL_MODE="$(DATABASE_SSL_MODE)" \
                      --set api.secrets.ENV="$(ENV)" \
                      --set api.secrets.AZURE_KEY_VAULT_URL="$(AZURE_KEY_VAULT_URL)" \
                      --set api.secrets.SUPER_ADMIN_EMAIL="$(SUPER_ADMIN_EMAIL)" \
                      --set api.secrets.SUPABASE_URL="$(SUPABASE_URL)" \
                      --set api.secrets.SUPABASE_ANON_KEY="$(SUPABASE_ANON_KEY)" \
                      --set api.secrets.SUPABASE_SERVICE_ROLE_KEY="$(SUPABASE_SERVICE_ROLE_KEY)" \
                      --set api.secrets.SUPABASE_JWT_SECRET="$(SUPABASE_JWT_SECRET)" \
                      --set api.secrets.AZURE_RESOURCE_GROUP="$(AZURE_RESOURCE_GROUP)" \
                      --set api.secrets.AZURE_SUBSCRIPTION_ID="$(AZURE_SUBSCRIPTION_ID)" \
                      --set api.secrets.RESEND_API_KEY="$(RESEND_API_KEY)" \
                      --set api.secrets.FROM_EMAIL="$(FROM_EMAIL)" \
                      --set api.secrets.APP_NAME="$(APP_NAME)" \
                      --set api.secrets.APP_URL="$(APP_URL)" \
                      --set api.secrets.ADMIN_APP_URL="$(ADMIN_APP_URL)" \
                      --set api.secrets.NANGO_SECRET_KEY="$(NANGO_SECRET_KEY)" \
                      --set api.secrets.NANGO_BASE_URL="https://api.nango.dev" \
                      --set knowledge-extract-worker.workloadIdentity.clientId="$(WORKLOAD_IDENTITY_WORKERS_CLIENT_ID)" \
                      --set knowledge-upload-worker.workloadIdentity.clientId="$(WORKLOAD_IDENTITY_WORKERS_CLIENT_ID)" \
                      --set organization-worker.workloadIdentity.clientId="$(WORKLOAD_IDENTITY_WORKERS_CLIENT_ID)" \
                      --set chat-worker.workloadIdentity.clientId="$(WORKLOAD_IDENTITY_WORKERS_CLIENT_ID)" \
                      --set knowledge-extract-worker.workloadIdentity.tenantId="$(WORKLOAD_IDENTITY_WORKERS_TENANT_ID)" \
                      --set knowledge-upload-worker.workloadIdentity.tenantId="$(WORKLOAD_IDENTITY_WORKERS_TENANT_ID)" \
                      --set organization-worker.workloadIdentity.tenantId="$(WORKLOAD_IDENTITY_WORKERS_TENANT_ID)" \
                      --set chat-worker.workloadIdentity.tenantId="$(WORKLOAD_IDENTITY_WORKERS_TENANT_ID)"


                  displayName: Helm Upgrade/Install
                  env:
                    HELM_RELEASE_NAME: $(HELM_RELEASE_NAME)
                    CHART_PATH: $(CHART_PATH)
                    WORKLOAD_IDENTITY_BACKEND_CLIENT_ID: $(WORKLOAD_IDENTITY_BACKEND_CLIENT_ID)
                    WORKLOAD_IDENTITY_WORKERS_CLIENT_ID: $(WORKLOAD_IDENTITY_WORKERS_CLIENT_ID)
                    ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)
                    BUILD_BUILDID: $(Build.BuildId)
                    DATABASE_HOST: $(DATABASE_HOST)
                    DATABASE_USER: $(DATABASE_USER)
                    DATABASE_PORT: $(DATABASE_PORT)
                    DATABASE_NAME: $(DATABASE_NAME)
                    DATABASE_PASSWORD: $(DATABASE_PASSWORD)
                    REDIS_HOST: $(REDIS_HOST)
                    REDIS_PORT: $(REDIS_PORT)
                    REDIS_PASSWORD: $(REDIS_PASSWORD)
                    AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
                    AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
                    AZURE_EMBEDDER_OPENAI_API_KEY: $(AZURE_EMBEDDER_OPENAI_API_KEY)
                    AZURE_EMBEDDER_OPENAI_ENDPOINT: $(AZURE_EMBEDDER_OPENAI_ENDPOINT)
                    AZURE_EMBEDDER_DEPLOYMENT: $(AZURE_EMBEDDER_DEPLOYMENT)
                    CLOUD_PROVIDER: $(CLOUD_PROVIDER)
                    APPLICATION_STORAGE_NAME: $(APPLICATION_STORAGE_NAME)
                    ORGANISATION_STORAGE_NAME: $(ORGANISATION_STORAGE_NAME)
                    APPLICATION_REGION: $(APPLICATION_REGION)
                    DATABASE_SSL_MODE: $(DATABASE_SSL_MODE)
                    ENV: $(ENV)
                    AZURE_KEY_VAULT_URL: $(AZURE_KEY_VAULT_URL)
                    SUPER_ADMIN_EMAIL: $(SUPER_ADMIN_EMAIL)
                    SUPABASE_URL: $(SUPABASE_URL)
                    SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
                    SUPABASE_SERVICE_ROLE_KEY: $(SUPABASE_SERVICE_ROLE_KEY)
                    SUPABASE_JWT_SECRET: $(SUPABASE_JWT_SECRET)
                    AZURE_RESOURCE_GROUP: $(AZURE_RESOURCE_GROUP)
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    RESEND_API_KEY: $(RESEND_API_KEY)
                    FROM_EMAIL: $(FROM_EMAIL)
                    APP_NAME: $(APP_NAME)
                    APP_URL: $(APP_URL)
                    ADMIN_APP_URL: $(ADMIN_APP_URL)
                    NANGO_SECRET_KEY: $(NANGO_SECRET_KEY)
                    NANGO_BASE_URL: $(NANGO_BASE_URL)
                    WORKLOAD_IDENTITY_API_TENANT_ID: $(WORKLOAD_IDENTITY_API_TENANT_ID)
                    WORKLOAD_IDENTITY_WORKERS_TENANT_ID: $(WORKLOAD_IDENTITY_WORKERS_TENANT_ID)

                - script: |
                    kubectl get pods -n copilotgtm
                    kubectl get deployments -n copilotgtm
                    kubectl get scaledobjects -n copilotgtm
                    echo "Checking worker deployments..."
                    kubectl get deployments -n copilotgtm | grep knowledge || echo "No knowledge workers deployed yet"
                  displayName: List AKS Deployments/Pods and Workers

                - script: |
                    # Force restart worker pods to ensure they pick up latest values
                    echo "Restarting worker deployments to ensure latest values are applied..."
                    kubectl rollout restart deployment copilot-backend-knowledge-extract-worker -n copilotgtm
                    kubectl rollout restart deployment copilot-backend-knowledge-upload-worker -n copilotgtm
                    kubectl rollout restart deployment copilot-backend-chat-worker -n copilotgtm
                    kubectl rollout restart deployment copilot-backend-organization-worker -n copilotgtm

                    # Wait for rollouts to complete
                    echo "Waiting for rollouts to complete..."
                    kubectl rollout status deployment copilot-backend-knowledge-extract-worker -n copilotgtm --timeout=300s
                    kubectl rollout status deployment copilot-backend-knowledge-upload-worker -n copilotgtm --timeout=300s
                    kubectl rollout status deployment copilot-backend-chat-worker -n copilotgtm --timeout=300s
                    kubectl rollout status deployment copilot-backend-organization-worker -n copilotgtm --timeout=300s
                  displayName: Force restart workers to pick up latest values

                - task: Bash@3
                  displayName: Rollback on Helm Deploy Failure
                  condition: failed()
                  inputs:
                    targetType: 'inline'
                    script: |
                      export KUBECONFIG=$(KUBECONFIG_FILE)
                      if helm status $(HELM_RELEASE_NAME); then
                        REVISION=$(helm history $(HELM_RELEASE_NAME) | awk 'NR==2{print $1}')
                        if [ ! -z "$REVISION" ]; then
                          echo "Rolling back to previous successful release (revision $REVISION)..."
                          helm rollback $(HELM_RELEASE_NAME) $REVISION
                        else
                          echo "No previous revision found for rollback."
                        fi
                      fi
