# ============================================================================
# Azure DevOps Production Pipeline with UV
# ============================================================================
# This pipeline:
# 1. Runs code quality checks (linting, formatting, type checking)
# 2. Runs security scans
# 3. Executes tests with coverage
# 4. Builds and pushes optimized Docker images using UV
# 5. Deploys to AKS using Helm
#
# OPTIMIZATIONS:
# - Single job for all quality checks (avoids duplicate dependency installs)
# - Docker cleanup runs before build to prevent "disk full" errors
# - Build cache is reused from ACR for faster builds
# - Multi-stage Dockerfile reduces final image size
#
# If disk space issues persist:
# - Consider using Microsoft-hosted agents with more disk (see below)
# - Use self-hosted agents with dedicated disk space
# - Split large builds across multiple stages
# ============================================================================

trigger:
  branches:
    include:
      - main
      - dev
      - uat

pr:
  branches:
    include:
      - main
      - dev
      - uat

variables:
  - name: CHART_PATH
    value: ./charts/application
  - name: KUBECONFIG_FILE
    value: $(Pipeline.Workspace)/kubeconfig.yaml
  - name: PYTHON_VERSION
    value: '3.11'

stages:
  # ==========================================================================
  # Stage 1: Code Quality & Testing
  # ==========================================================================
  # OPTIMIZATION: Single job for all quality checks to avoid duplicate
  # dependency installation (previously installed deps 2x - wasted ~1min)
  # ==========================================================================
  - stage: QualityCheck
    displayName: Code Quality & Tests
    jobs:
      - job: QualityAndSecurity
        displayName: Quality Checks & Security Scan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # ================================================================
          # Setup Environment (only once for all checks)
          # ================================================================
          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: 'Install UV'

          - script: |
              uv python install $(PYTHON_VERSION)
            displayName: 'Install Python $(PYTHON_VERSION)'

          - script: |
              uv sync --frozen --no-install-project --no-dev --only-group quality
              source .venv/bin/activate
            displayName: 'Install Quality Tools Only (Ruff, Bandit, MyPy)'

          # ================================================================
          # Code Quality Checks
          # ================================================================
          - script: |
              source .venv/bin/activate
              ruff format --check src/ tests/
            displayName: '✨ Code Formatting Check (Ruff Format)'

          - script: |
              source .venv/bin/activate
              ruff check src/ tests/
            displayName: '🔍 Linting Check (Ruff)'

          - script: |
              source .venv/bin/activate
              mypy src/ || true
            displayName: '📝 Type Checking (MyPy) - Advisory Only'

          # ================================================================
          # Security Scan
          # ================================================================
          - script: |
              source .venv/bin/activate
              bandit -c pyproject.toml -r src/ -f json -o bandit-report.json || true
              bandit -c pyproject.toml -r src/
            displayName: '🔒 Security Scan (Bandit)'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Security Report'
            inputs:
              targetPath: 'bandit-report.json'
              artifact: 'security-report'
            condition: succeededOrFailed()

      # ==========================================================================
      # TODO: Enable Tests later
      # ==========================================================================
      # Tests are currently disabled due to:
      # 1. Supabase client initialization issues at import time
      # 2. Missing environment variables in test environment
      #
      # To re-enable:
      # - Uncomment the Tests job below
      # - Implement lazy initialization for Supabase clients
      # - Configure test environment variables or use mocks
      # ==========================================================================

