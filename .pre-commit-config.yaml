# Pre-commit hooks for code quality
# Install: uv add --dev pre-commit && uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(uv\.lock|.*\.md|migrations/)
        files: \.(py|yaml|yml|txt)$
      - id: end-of-file-fixer
        exclude: ^(uv\.lock|migrations/)
        files: \.(py|yaml|yml|txt)$
      - id: check-yaml
        args: ['--unsafe']
        files: \.(yaml|yml)$
        exclude: ^charts/
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
        files: \.json$
      - id: check-toml
        files: \.toml$
      - id: check-merge-conflict
      - id: debug-statements
        files: \.py$
      - id: mixed-line-ending
        files: \.py$

  # Python formatting and linting - ONLY src/ and tests/
  # Using Ruff for both - faster and more consistent than Black + Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        files: ^(src/|tests/).*\.py$
      - id: ruff-format
        files: ^(src/|tests/).*\.py$

  # Black removed - using Ruff format as single formatter (10-100x faster)
  # - repo: https://github.com/psf/black
  #   rev: 25.1.0
  #   hooks:
  #     - id: black
  #       language_version: python3.11
  #       args: ['--config', 'pyproject.toml']
  #       files: ^(src/|tests/).*\.py$

  # Security checks - ONLY src/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        files: ^src/.*\.py$
        exclude: ^tests/
        additional_dependencies: ['bandit[toml]']

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ['--ignore', 'DL3008', '--ignore', 'DL3009', '--ignore', 'DL3025']
        files: Dockerfile.*

  # Check for secrets (temporarily disabled - baseline setup needed)
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: ['--baseline', '.secrets.baseline']
  #       exclude: ^(uv\.lock|\.env\.example|\.venv/|migrations/)$
  #       files: \.(py|yaml|yml|env|json)$

# Configuration
default_language_version:
  python: python3.11

# Files to exclude globally - CRITICAL: Exclude .venv!
exclude: |
  (?x)^(
      \.venv/.*|
      \.git/.*|
      __pycache__/.*|
      \.pytest_cache/.*|
      \.mypy_cache/.*|
      \.ruff_cache/.*|
      \.tox/.*|
      build/.*|
      dist/.*|
      \.eggs/.*|
      migrations/.*|
      uv\.lock|
      cache/.*|
      htmlcov/.*|
      .*\.egg-info/.*
  )$
