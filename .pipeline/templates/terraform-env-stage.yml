# Template: Terraform stage (plan + apply)
# Runs on a self-hosted agent (required for Private Link resources like Key Vault).
#
# ============================================================================
# VARIABLE STRATEGY (Simpler & More Secure)
# ============================================================================
# - Non-sensitive values: Committed in terraform.tfvars (per environment folder)
# - Sensitive values ONLY: Passed via Variable Group as TF_VAR_*
#   Terraform automatically picks up TF_VAR_* environment variables!
#
# Required secrets in Variable Group (mark as 🔒 secret):
#   - TF_VAR_db_password
#   - TF_VAR_azuredevops_pat
#   - TF_VAR_admin_password
#   - TF_VAR_supabase_anon_key
#   - TF_VAR_supabase_service_role_key
#   - TF_VAR_supabase_jwt_secret
#   - TF_VAR_resend_api_key
#   - TF_VAR_nango_secret
#
# NOTE: Azure OpenAI API key is now automatically retrieved from the
#       Azure OpenAI resource via the azure_openai module.
# ============================================================================

parameters:
  - name: stageName
    type: string
  - name: envName
    type: string
  - name: tfWorkingDir
    type: string
  - name: azureServiceConnection
    type: string
  - name: variableGroupName
    type: string
  - name: agentPoolName
    type: string
  - name: stageCondition
    type: string
    default: succeeded()
  - name: applyCondition
    type: string
  - name: approvalEnvironment
    type: string
  - name: artifactName
    type: string
  - name: tfVersion
    type: string
    default: '1.9.0'
  - name: dependsOn
    type: object
    default: []

stages:
  - stage: ${{ parameters.stageName }}
    displayName: 'Terraform (${{ parameters.envName }})'
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.stageCondition }}

    variables:
      - name: TF_VERSION
        value: ${{ parameters.tfVersion }}
      - name: TF_WORKING_DIR
        value: ${{ parameters.tfWorkingDir }}
      # Import secrets from Variable Group - they become TF_VAR_* env vars automatically
      - group: ${{ parameters.variableGroupName }}

    jobs:
      - job: TerraformPlan
        displayName: 'Validate & Plan'
        pool:
          name: ${{ parameters.agentPoolName }}
        steps:
          - checkout: self
            fetchDepth: 1

          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: 'Terraform Init, Validate & Plan'
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(TF_WORKING_DIR)
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                # ============================================================
                # ARM credentials for Terraform AzureRM provider
                # Must be set BEFORE terraform init (for backend auth)
                # ============================================================
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                # Check for OIDC (Workload Identity Federation) vs secret-based auth
                if [ -n "${servicePrincipalKey:-}" ]; then
                  echo "Using Service Principal with client secret"
                  export ARM_CLIENT_SECRET="$servicePrincipalKey"
                  export ARM_USE_OIDC=false
                elif [ -n "${idToken:-}" ]; then
                  echo "Using Workload Identity Federation (OIDC)"
                  export ARM_USE_OIDC=true
                  export ARM_OIDC_TOKEN="$idToken"
                else
                  echo "##vso[task.logissue type=error]No authentication method available. Ensure service connection is configured correctly."
                  exit 1
                fi

                # ============================================================
                # Terraform Variable Strategy:
                # 1. terraform.tfvars (in repo) - non-sensitive config values
                # 2. TF_VAR_* env vars (from Variable Group) - secrets only
                #
                # Azure DevOps automatically exports Variable Group variables
                # as environment variables. Terraform reads TF_VAR_* automatically!
                # ============================================================

                echo "=== Terraform Init ==="
                terraform init -input=false

                # ============================================================
                # Fresh Infrastructure Detection
                # ============================================================
                # Problem: Kubernetes/Helm providers require AKS credentials to initialize.
                # Even with -target, terraform plan initializes ALL providers first.
                # When AKS doesn't exist, provider init fails before plan even starts.
                # Solution: Skip plan entirely and let apply stage handle two-step deployment.
                # ============================================================

                # Check if AKS exists in state
                AKS_EXISTS=$(terraform state list 2>/dev/null | grep -c "module.aks.azurerm_kubernetes_cluster" || echo "0")

                if [ "$AKS_EXISTS" -eq "0" ]; then
                  echo "=== AKS Not Found - Running Targeted Plan (Core Infrastructure Only) ==="
                  echo "Kubernetes/Helm resources will be planned after AKS is created."

                  # Plan only core infrastructure (excludes helm_release, kubernetes_manifest, etc.)
                  terraform plan -var-file="terraform.tfvars" -out=tfplan -input=false \
                    -target="module.resource_group" \
                    -target="module.vnet" \
                    -target="module.waf" \
                    -target="module.redis" \
                    -target="module.acr" \
                    -target="module.aks" \
                    -target="module.database_key_vault" \
                    -target="module.master_key_vault" \
                    -target="module.master_storage_account" \
                    -target="module.org_storage_account" \
                    -target="module.application_database" \
                    -target="module.azure_openai" \
                    -target="module.workload_identity_backend" \
                    -target="module.workload_identity_workers" \
                    -target="azurerm_user_assigned_identity.cert_manager_dns" \
                    -target="azurerm_role_assignment.cert_manager_dns_contributor" \
                    -target="azurerm_federated_identity_credential.cert_manager" \
                    -target="azurerm_role_assignment.aks_kubelet_acr_pull" \
                    -target="azurerm_role_assignment.agic_appgw_contributor" \
                    -target="azurerm_role_assignment.agic_rg_reader" \
                    -target="azurerm_role_assignment.agic_vnet_network_contributor" || {
                      exitCode=$?
                      if [ $exitCode -eq 1 ]; then
                        echo "##vso[task.logissue type=error]Terraform plan failed!"
                        exit 1
                      fi
                    }
                else
                  echo "=== AKS Exists - Running Full Plan ==="

                  echo "=== Terraform Validate ==="
                  terraform validate

                  echo "=== Terraform Format Check ==="
                  terraform fmt -check -recursive || echo "##vso[task.logissue type=warning]Terraform files are not formatted."

                  echo "=== Terraform Plan ==="
                  terraform plan -var-file="terraform.tfvars" -out=tfplan -input=false -detailed-exitcode || {
                    exitCode=$?
                    if [ $exitCode -eq 1 ]; then
                      echo "##vso[task.logissue type=error]Terraform plan failed!"
                      exit 1
                    fi
                    # Exit code 2 means changes detected - continue
                  }

                  echo "=== Plan Summary ==="
                  terraform show -no-color tfplan
                fi
            env:
              # Secret variables must be explicitly mapped to be available in scripts
              TF_VAR_azuredevops_pat: $(TF_VAR_azuredevops_pat)
              TF_VAR_db_password: $(TF_VAR_db_password)
              TF_VAR_admin_password: $(TF_VAR_admin_password)
              TF_VAR_supabase_anon_key: $(TF_VAR_supabase_anon_key)
              TF_VAR_supabase_service_role_key: $(TF_VAR_supabase_service_role_key)
              TF_VAR_supabase_jwt_secret: $(TF_VAR_supabase_jwt_secret)
              TF_VAR_resend_api_key: $(TF_VAR_resend_api_key)
              TF_VAR_nango_secret: $(TF_VAR_nango_secret)

          - publish: $(TF_WORKING_DIR)/tfplan
            artifact: ${{ parameters.artifactName }}
            displayName: 'Publish Plan Artifact'

      - deployment: TerraformApply
        displayName: 'Apply Infrastructure Changes'
        dependsOn: TerraformPlan
        condition: ${{ parameters.applyCondition }}
        environment: ${{ parameters.approvalEnvironment }}
        pool:
          name: ${{ parameters.agentPoolName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform $(TF_VERSION)'
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - download: current
                  artifact: ${{ parameters.artifactName }}
                  displayName: 'Download Plan Artifact'

                - task: AzureCLI@2
                  displayName: 'Terraform Init & Apply'
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(TF_WORKING_DIR)
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      # ARM credentials for Terraform (must be set before terraform init)
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                      # Check for OIDC vs secret-based auth
                      if [ -n "${servicePrincipalKey:-}" ]; then
                        echo "Using Service Principal with client secret"
                        export ARM_CLIENT_SECRET="$servicePrincipalKey"
                        export ARM_USE_OIDC=false
                      elif [ -n "${idToken:-}" ]; then
                        echo "Using Workload Identity Federation (OIDC)"
                        export ARM_USE_OIDC=true
                        export ARM_OIDC_TOKEN="$idToken"
                      else
                        echo "##vso[task.logissue type=error]No authentication method available."
                        exit 1
                      fi

                      echo "=== Terraform Init ==="
                      terraform init -input=false

                      # ============================================================
                      # Two-Step Deployment for Fresh Infrastructure
                      # ============================================================
                      # Flow when AKS doesn't exist:
                      #   1. Apply Step 1 (core infrastructure from artifact)
                      #   2. Plan Full (now Kubernetes provider can connect to AKS)
                      #   3. Apply Full
                      # Flow when AKS exists:
                      #   1. Apply from artifact (full plan)
                      # ============================================================

                      # Check if AKS exists in state
                      AKS_EXISTS=$(terraform state list 2>/dev/null | grep -c "module.aks.azurerm_kubernetes_cluster" || echo "0")

                      if [ "$AKS_EXISTS" -eq "0" ]; then
                        echo "============================================================"
                        echo "=== FRESH INFRASTRUCTURE DEPLOYMENT (Two-Step Process) ==="
                        echo "============================================================"

                        echo ""
                        echo "=== Step 1/3: Apply Core Infrastructure (from plan artifact) ==="
                        cp "$(Pipeline.Workspace)/${{ parameters.artifactName }}/tfplan" "./tfplan"
                        terraform apply -input=false -auto-approve tfplan

                        echo ""
                        echo "=== Step 2/3: Plan Full Infrastructure (Kubernetes resources) ==="
                        echo "AKS now exists - Kubernetes/Helm providers can connect."
                        terraform plan -var-file="terraform.tfvars" -out=tfplan-full -input=false

                        echo ""
                        echo "=== Step 3/3: Apply Full Infrastructure ==="
                        terraform apply -input=false -auto-approve tfplan-full

                      else
                        echo "=== AKS Exists - Running Standard Apply ==="
                        # Copy plan file from artifact
                        cp "$(Pipeline.Workspace)/${{ parameters.artifactName }}/tfplan" "./tfplan"
                        terraform apply -input=false -auto-approve tfplan
                      fi

                      echo ""
                      echo "=== Apply Complete ==="
                  env:
                    # Secret variables must be explicitly mapped to be available in scripts
                    TF_VAR_azuredevops_pat: $(TF_VAR_azuredevops_pat)
                    TF_VAR_db_password: $(TF_VAR_db_password)
                    TF_VAR_admin_password: $(TF_VAR_admin_password)
                    TF_VAR_supabase_anon_key: $(TF_VAR_supabase_anon_key)
                    TF_VAR_supabase_service_role_key: $(TF_VAR_supabase_service_role_key)
                    TF_VAR_supabase_jwt_secret: $(TF_VAR_supabase_jwt_secret)
                    TF_VAR_resend_api_key: $(TF_VAR_resend_api_key)
                    TF_VAR_nango_secret: $(TF_VAR_nango_secret)
