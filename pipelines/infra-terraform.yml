# =========================================================================
# Terraform Infrastructure Pipeline - Best Practices
# =========================================================================
# - Any branch push: terraform validate + plan (validation only)
# - PR to main: terraform plan (review what will change)
# - Merge to main: terraform plan + apply (with manual approval)
# =========================================================================

trigger:
  branches:
    include:
      - '*'  # Trigger on ALL branches
  paths:
    include:
      - terraform/**
      - pipelines/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/**

parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - uat
      - prod

  - name: forceApply
    displayName: Force Apply (use with caution)
    type: boolean
    default: false

variables:
  - name: TF_VERSION
    value: '1.9.0'
  - name: TF_WORKING_DIR
    value: 'terraform/azure/${{ parameters.environment }}'
  - name: ARM_USE_OIDC
    value: false
  - name: AZURE_SERVICE_CONNECTION
    value: 'copilotgtm-arc-ci-cd-service--${{ parameters.environment }}'

stages:
  # -------------------------------------------------------------------------
  # Stage 1: Validate & Plan (runs on EVERY push)
  # -------------------------------------------------------------------------
  - stage: Plan
    displayName: 'Terraform Plan (${{ parameters.environment }})'
    pool:
      name: StaticAgentPool  # Self-hosted agent inside VNet
    jobs:
      - job: TerraformPlan
        displayName: 'Validate & Plan'
        steps:
          - checkout: self
            fetchDepth: 1

          - task: TerraformInstaller@1
            displayName: 'Install Terraform $(TF_VERSION)'
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: 'Terraform Init, Validate & Plan'
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              workingDirectory: $(TF_WORKING_DIR)
              addSpnToEnvironment: true
              inlineScript: |
                # Export ARM credentials for Terraform
                $env:ARM_CLIENT_ID = $env:servicePrincipalId
                $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
                $env:ARM_TENANT_ID = $env:tenantId
                $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

                Write-Host "=== Terraform Init ==="
                terraform init -input=false

                Write-Host "=== Terraform Validate ==="
                terraform validate
                if ($LASTEXITCODE -ne 0) {
                    Write-Host "##vso[task.logissue type=error]Terraform validation failed!"
                    exit 1
                }

                Write-Host "=== Terraform Format Check ==="
                terraform fmt -check -recursive
                if ($LASTEXITCODE -ne 0) {
                    Write-Host "##vso[task.logissue type=warning]Terraform files are not formatted. Run 'terraform fmt -recursive'"
                }

                Write-Host "=== Terraform Plan ==="
                terraform plan -var-file="terraform.tfvars" -out=tfplan -input=false -detailed-exitcode
                $planExitCode = $LASTEXITCODE
                
                if ($planExitCode -eq 0) {
                    Write-Host "##vso[task.logissue type=info]No changes detected."
                } elseif ($planExitCode -eq 2) {
                    Write-Host "##vso[task.logissue type=warning]Changes detected - review plan output."
                } else {
                    Write-Host "##vso[task.logissue type=error]Terraform plan failed!"
                    exit 1
                }

                Write-Host "=== Plan Summary ==="
                terraform show -no-color tfplan

          - publish: $(TF_WORKING_DIR)/tfplan
            artifact: tfplan-${{ parameters.environment }}
            displayName: 'Publish Plan Artifact'

  # -------------------------------------------------------------------------
  # Stage 2: Apply (only on main branch, with approval)
  # -------------------------------------------------------------------------
  - stage: Apply
    displayName: 'Terraform Apply (${{ parameters.environment }})'
    dependsOn: Plan
    # Only run apply on main branch OR when forceApply is true
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq('${{ parameters.forceApply }}', 'true')
        ),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    pool:
      name: StaticAgentPool
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Infrastructure Changes'
        # Environment with approval gates - create this in Azure DevOps
        environment: 'terraform-${{ parameters.environment }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform $(TF_VERSION)'
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - download: current
                  artifact: tfplan-${{ parameters.environment }}
                  displayName: 'Download Plan Artifact'

                - task: AzureCLI@2
                  displayName: 'Terraform Init & Apply'
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: 'pscore'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(TF_WORKING_DIR)
                    addSpnToEnvironment: true
                    inlineScript: |
                      $env:ARM_CLIENT_ID = $env:servicePrincipalId
                      $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
                      $env:ARM_TENANT_ID = $env:tenantId
                      $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)

                      Write-Host "=== Terraform Init ==="
                      terraform init -input=false

                      # Copy plan file from artifact
                      Copy-Item "$(Pipeline.Workspace)/tfplan-${{ parameters.environment }}/tfplan" -Destination "./tfplan"

                      Write-Host "=== Terraform Apply ==="
                      terraform apply -input=false -auto-approve tfplan

                      Write-Host "=== Apply Complete ==="
