# =============================================================================
# Docker Compose for Local Development - Security Hardened
# =============================================================================
# Compliance: CIS Docker Benchmark v1.8.0, OWASP Docker Security
#
# Security Features Applied:
#   - no-new-privileges: Prevents privilege escalation
#   - cap_drop: ALL: Drops all Linux capabilities
#   - Resource limits: Prevents resource exhaustion
#
# Azure Authentication: Mounts your local ~/.azure credentials into containers
# so they can authenticate with Azure services (Key Vault, Storage, etc.)
#
# Prerequisites:
#   1. Run `az login` on your local machine before starting
#   2. Copy .env to .env.local and adjust as needed
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up api redis       # Start only API and Redis
#   docker-compose logs -f api        # Follow API logs
#   docker-compose down               # Stop all services
# =============================================================================

name: copilot-backend

# =============================================================================
# Common Security & Resource Configuration (YAML Anchors)
# =============================================================================
# Combined anchors (YAML only allows one << merge key per level)

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-api-service: &api-service
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 2G
      reservations:
        cpus: '0.25'
        memory: 512M

x-worker-service: &worker-service
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 2G
      reservations:
        cpus: '0.25'
        memory: 256M

x-knowledge-worker-service: &knowledge-worker-service
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: '4'
        memory: 8G
      reservations:
        cpus: '0.5'
        memory: 1G

services:
  # ---------------------------------------------------------------------------
  # Redis - Local instance (replaces Azure Redis for development)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: copilot-redis
    <<: *common-security
    ports:
      - "6379:6379"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copilot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ---------------------------------------------------------------------------
  # API Service (FastAPI Backend)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: api
    container_name: copilot-api
    <<: *api-service
    command: /app/.venv/bin/uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      # Set to local environment for proper Redis SSL handling
      - ENV=local
      # Override Redis to use local instance
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      # Celery broker URL (local Redis, no SSL)
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      # Mount Azure CLI credentials for Azure service authentication
      # Removed :ro to allow token refreshes or login from within container if needed
      - azure-data:/home/appuser/.azure
      # Mount source code for hot reload (optional - comment out for production-like testing)
      - ./src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - copilot-network

  # ---------------------------------------------------------------------------
  # Knowledge Extract Worker
  # ---------------------------------------------------------------------------
  knowledge-extract-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: knowledge-worker
    container_name: copilot-knowledge-extract-worker
    <<: *knowledge-worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.knowledge_worker.celery_app worker
      --queues=knowledge_extract
      --concurrency=3
      --loglevel=info
      --hostname=knowledge-extract@%h
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
      # ML model cache (persistent)
      - model-cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network
    # profiles: ["knowledge"]

  # ---------------------------------------------------------------------------
  # Knowledge Upload Worker
  # ---------------------------------------------------------------------------
  knowledge-upload-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: knowledge-worker
    container_name: copilot-knowledge-upload-worker
    <<: *knowledge-worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.knowledge_worker.celery_app worker
      --queues=knowledge_upload
      --concurrency=4
      --loglevel=info
      --hostname=knowledge-upload@%h
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
      - model-cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network
    # profiles: ["knowledge"]

  # ---------------------------------------------------------------------------
  # Organization Worker
  # ---------------------------------------------------------------------------
  organization-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: light-worker
    container_name: copilot-organization-worker
    <<: *worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.organization_worker.celery_app worker
      --queues=organization
      --concurrency=5
      --loglevel=info
      --hostname=organization@%h
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network
    # profiles: ["organization"]

  # ---------------------------------------------------------------------------
  # Chat Worker (handles attachments, chat_processing, chat_messages)
  # ---------------------------------------------------------------------------
  chat-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: light-worker
    container_name: copilot-chat-worker
    <<: *worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.chat_worker.celery_app worker
      --queues=attachments,chat_processing,chat_messages
      --concurrency=5
      --loglevel=info
      --hostname=chat@%h
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network
    profiles: ["chat"]

  # ---------------------------------------------------------------------------
  # Integrations Worker (handles CRM/third-party sync)
  # ---------------------------------------------------------------------------
  integrations-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: integrations-worker
    container_name: copilot-integrations-worker
    <<: *worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.integrations_worker.celery_app worker
      --queues=integrations,integrations_priority
      --concurrency=8
      --loglevel=info
      --hostname=integrations@%h
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network

  # ---------------------------------------------------------------------------
  # Integrations Beat Scheduler
  # ---------------------------------------------------------------------------
  integrations-beat:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: integrations-worker
    container_name: copilot-integrations-beat
    <<: *worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.integrations_worker.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network
    # profiles: ["integrations"]

  # ---------------------------------------------------------------------------
  # Deal Worker (handles deal-meeting matching, email matching, stakeholders)
  # ---------------------------------------------------------------------------
  deal-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: light-worker
    container_name: copilot-deal-worker
    <<: *worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.deal_worker.celery_app worker
      --queues=deal,deal_jobs
      --concurrency=4
      --loglevel=info
      --hostname=deal@%h
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network

  # ---------------------------------------------------------------------------
  # Deal Beat Scheduler (Celery Beat for scheduled tasks)
  # ---------------------------------------------------------------------------
  deal-beat:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: light-worker
    container_name: copilot-deal-beat
    <<: *worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.deal_worker.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      - ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_SSL_CERT_REQS=none
      - REDIS_PASSWORD=
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - azure-data:/home/appuser/.azure
      - ./src:/app/src:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network
    # profiles: ["chat"]

  # ---------------------------------------------------------------------------
  # Flower - Celery Monitoring UI (Optional)
  # ---------------------------------------------------------------------------
  flower:
    image: mher/flower:latest
    container_name: copilot-flower
    <<: *common-security
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - copilot-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # profiles:
    #   - monitoring

  # ---------------------------------------------------------------------------
  # Loki - Log Aggregation (collects and stores logs)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.4
    container_name: copilot-loki
    <<: *common-security
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copilot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    # profiles:
    #   - monitoring

  # ---------------------------------------------------------------------------
  # Promtail - Log Shipper (collects Docker logs and sends to Loki)
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.4
    container_name: copilot-promtail
    <<: *common-security
    volumes:
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - copilot-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # profiles:
    #   - monitoring

  # ---------------------------------------------------------------------------
  # Grafana - Visualization & Dashboards
  # Access at: http://localhost:3001 (admin/admin)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.3.1
    container_name: copilot-grafana
    <<: *common-security
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - copilot-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    # profiles:
    #   - monitoring

# =============================================================================
# Networks
# =============================================================================
networks:
  copilot-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  azure-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  model-cache:
    driver: local
