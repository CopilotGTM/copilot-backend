# =============================================================================
# Networks
# =============================================================================
networks:
  copilot-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  azure-data:
    driver: local
  model-cache:
    driver: local
