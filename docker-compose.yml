  # ---------------------------------------------------------------------------
  # Deal Worker (handles deal-meeting matching, email matching, stakeholders)
  # ---------------------------------------------------------------------------
  deal-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
      target: light-worker
    container_name: copilot-deal-worker
    <<: *worker-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: >
      celery -A src.workers.deal_worker.celery_app worker
